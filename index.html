nder -MM10 ausfahren. Daten wie -MB11, Spule 24V 2,5W, SPS %Q1.1. Funktion: Bestromt schiebt Bauteil aus Magazin. Aufbau wie -MB11. Prüfung: Widerstand 230Ω, Funktion. Typischer Fehler: Spulen vertauscht -MB11 und -MB12 dann fährt falsch. In F26 0942: -MB12 ist Aktion Vereinzeln, im GRAFCET Schritt 2 mit Zeit 2s, im Programm TON 3s und Endlage -BG12 abfragen, wenn -BG12 nicht kommt Störung."},{id:"-MB21",bezeichnung:"Magnetventil -MM20 einfahren Spule",ort:"Aktorik",kat:"Pneumatik",icon:"\uD83D\uDD00",kurz:"Ventilspule 24V für Stopper einfahren freigeben",erklaerung:"Das Magnetventil -MB21 ist die Spule für Stopper Zylinder -MM20 einfahren, gibt Strecke frei. Daten: 24V 2,5W, SPS %Q1.2. Funktion: Einfahren lässt Bauteile durch. Prüfung: Widerstand, Funktion. In F26 0942: -MB21 nach Sortieren Bauteil freigeben, im Programm nach Abwerfen -MB21 an bis -BG21 kommt."},{id:"-MB22",bezeichnung:"Magnetventil -MM20 ausfahren Spule",ort:"Aktorik",kat:"Pneumatik",icon:"\uD83D\uDD00",kurz:"Ventilspule 24V für Stopper ausfahren sperren",erklaerung:"Das Magnetventil -MB22 ist die Spule für Stopper Zylinder -MM20 ausfahren, sperrt Strecke für Kontrolle. Daten: 24V 2,5W, SPS %Q1.3. Funktion: Ausfahren hält Bauteil an für -BG1/-BG2. Prüfung: Widerstand, Funktion. In F26 0942: -MB22 wird gesetzt wenn Bauteil kommt, im Programm wenn -BG3 oder Vereinzeler fertig dann -MB22 ausfahren."},{id:"-MB31",bezeichnung:"Magnetventil -MM30 einfahren Spule",ort:"Aktorik",kat:"Pneumatik",icon:"\uD83D\uDD00",kurz:"Ventilspule 24V für Heber einfahren unten",erklaerung:"Das Magnetventil -MB31 ist die Spule für Heber Zylinder -MM30 einfahren nach unten Grundstellung. Daten: 24V 2,5W, aber größere Spule 4,5W wegen Ø32 Zylinder, SPS %Q1.4. Funktion: Einfahren bringt Heber nach unten. Prüfung: Widerstand 128Ω bei 4,5W, Funktion. In F26 0942: -MB31 nach Abwerfen, im Programm nach Magnet aus -MB31 an bis -BG31 kommt."},{id:"-MB32",bezeichnung:"Magnetventil -MM30 ausfahren Spule",ort:"Aktorik",kat:"Pneumatik",icon:"\uD83D\uDD00",kurz:"Ventilspule 24V für Heber ausfahren oben heben",erklaerung:"Das Magnetventil -MB32 ist die Spule für Heber Zylinder -MM30 ausfahren nach oben heben. Daten: 24V 4,5W, SPS %Q1.5. Funktion: Ausfahren hebt Bauteil mit Magnet -MB40. Prüfung: Widerstand, Funktion, Geschwindigkeit. In F26 0942: -MB32 nach Magnet an, im Programm wenn -BG22 und Material erkannt und Magnet an dann -MB32 ausfahren bis -BG32 oben."},{id:"-MB9",bezeichnung:"Magnetventil Hauptventil -QM9 24V",ort:"Aktorik",kat:"Pneumatik",icon:"\uD83D\uDED1",kurz:"Hauptventil Spule 24V, von Sicherheitsrelais -KE2",erklaerung:"Das Magnetventil -MB9 ist die Spule des Hauptventils -QM9, 3/2 Wege Sicherheitsventil. Daten: 24V DC 4,5W, Strom 0,18A, Widerstand 128Ω, Ansteuerung von -KE2 Sicherheitsrelais nicht von SPS. Funktion: Bestromt = Anlage hat Druck, stromlos = entlüftet, NOT-AUS. Aufbau: Spule auf -QM9, LED, Handhilfsbetätigung. Anschluss: +24V von -KE2 Ausgang, 0V, über -XD2. Normen: ISO 13849 PLd. Prüfung: Funktionstest NOT-AUS entlüftet in <1s, Spulenwiderstand, Strom. Sicherheit: Muss von Sicherheitskreis kommen, nicht von SPS. Typischer Fehler: Spule von SPS angesteuert dann kein PLd. In F26 0942: -MB9 ist Sicherheitsprüfung, muss im Stromlaufplan erkannt werden dass von -KE2 kommt, im Fachgespräch erklären warum Sicherheitsventil."}],ry=cl.flatMap((e)=>e.ids);function Vc(){let[e,n]=V.useState("dashboard"),[t,r]=V.useState(null),[l,o]=V.useState(0),[i,a]=V.useState(!1),[s,v]=V.useState(""),[h,C]=V.useState(new Set([0])),[g,I]=V.useState(0),[S,U]=V.useState(0),[K,y]=V.useState({}),[p,A]=V.useState(0),[w,k]=V.useState({}),[R,B]=V.useState("mittel"),[N,ne]=V.useState(!1),W=V.useRef(Date.now()),[$e,Zo]=V.useState(!1),[Kd,Bc]=V.useState(!0),[Wd,Dd]=V.useState(!1),al=V.useRef(null),Go=V.useRef(Date.now()),[nt,Nc]=V.useState(""),[Jo,Fd]=V.useState("Alle"),[Od,qo]=V.useState(new Set(["et-grund"])),[rr,Mc]=V.useState("grid"),[Vn,Ge]=V.useState(null),[Pc,tt]=V.useState(!1),[lr,fl]=V.useSt
