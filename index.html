}

body {
  background:
    radial-gradient(1200px at 15% -10%, rgba(10,132,255,0.18), transparent 60%),
    radial-gradient(900px at 85% 10%, rgba(192,192,192,0.12), transparent 60%),
    radial-gradient(1000px at 50% 120%, rgba(10,132,255,0.10), transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  background-attachment: fixed;
}

::-webkit-scrollbar {
  width:8px;
  height:8px;
}

::-webkit-scrollbar-thumb {
  background:#252A36;
  border-radius:999px;
}

::-webkit-scrollbar-track {
  background: transparent;

/* cards */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.stat-card {
  background: linear-gradient(135deg, var(--surface-2) 0%, var(--surface-3) 100%);
  border: 1px solid var(--border);
  border-radius: 20px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  position: relative;
  overflow: hidden;
}

.stat-card::before {
  content:"";
  position:absolute;
  inset:0;
  background: radial-gradient(400px at 30% 0%, rgba(10,132,255,0.16), transparent 70%);
  pointer-events:none;
}

.ring {
  width:52px;
  height:52px;
  border-radius:999px;
  display:grid;
  place-items:center;
  background: conic-gradient(var(--accent) var(--p,0%), #1E2638 var(--p,0%));
  padding:3px;
}

.ring > div {
  width:100%;
  height:100%;
  border-radius:999px;
  background: #151821;
  display:grid;
  place-items:center;
  font-size:13px;
  font-weight:700;
}

.bar-track {
  height:8px;
  border-radius:999px;
  background:#1A1E29;
  overflow:hidden;
}

.bar-fill {
  height:100%;
  border-radius:999px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width .6s ease;
}

.topic-row {
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 16px;
  border-radius:14px;
  border:1px solid transparent;
  transition: all .25s ease;
  cursor:pointer;
}

.topic-row:hover {
  background: rgba(27,30,38,0.8);
  border-color: var(--border);
  transform: translateY(-1px);
}

.topic-icon {
  width:36px;
  height:36px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background: linear-gradient(135deg, #1E2638, #161A26);
  border:1px solid var(--border);
  font-size:18px;
  flex-shrink:0;
}

.flashcard {
  perspective: 1000px;
}

.flashcard-inner {
  position:relative;
  min-height:340px;
  transition: transform .7s cubic-bezier(.2,.8,.2,1);
  transform-style: preserve-3d;
}

.flashcard-inner.flipped {
  transform: rotateY(180deg);
}

.flash-face {
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  border-radius:20px;
  padding:24px;
  display:flex;
  flex-direction:column;
}

.flash-face.back {
  transform: rotateY(180deg);
}

.badge {
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 12px;
  border-radius:999px;
  background: rgba(10,132,255,0.12);
  border:1px solid rgba(10,132,255,0.25);
  font-size:11px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:#7AB8FF;
}

.tab-pill {
  padding:10px 16px;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
  border:1px solid transparent;
  transition: all .2s;
  white-space:nowrap;
}

.tab-pill.active {
  background: var(--accent);
  color:white;
  box-shadow: 0 8px 24px rgba(10,132,255,0.35);
}

.tab-pill:not(.active):hover {
  background: rgba(255,255,255,0.06);
  border-color: var(--border);
}

.konnen-chip {
  display:inline-flex;
  padding:6px 10px;
  border-radius:999px;
  background:#1A1E29;
  border:1px solid var(--border);
  font-size:11px;
  color: var(--text-dim);
}

.qr-box {
  background:white;
  border-radius:16px;
  padding:18px;
  display:grid;
  place-items:center;
}

/* ===== GOODNOTES STYLE ===== */

.goodnotes-full {
  min-height: calc(100vh - 180px);
  display: flex;
  flex-direction: column;
  position: relative;
}

.goodnotes-progress {
  height: 4px;
  background: #1A1E29;
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 16px;
}

.goodnotes-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #0A84FF, #5AC8FF);
  transition: width 0.6s cubic-bezier(0.23,1,0.32,1);
}

.goodnotes-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 4px;
  flex-wrap: wrap;
}

.goodnotes-back {
  padding: 8px 14px;
  border-radius: 999px;
  background: #1A1E29;
  border: 1px solid #252A36;
  font-size: 12px;
  font-weight: 600;
  color: #9AA3B8;
  transition: all .2s;
}

.goodnotes-back:hover {
  background:#252A36;
  color:#fff;
}

.goodnotes-title {
  display:flex;
  align-items:center;
  gap:8px;
}

.goodnotes-chip {
  padding: 6px 12px;
  border-radius: 999px;
  background: #151821;
  border: 1px solid #252A36;
  font-size: 11px;
  color: #9AA3B8;
}

.goodnotes-stage {
  flex: 1;
  display: flex;
  align-items: center;

.goodnotes-arrow {

.goodnotes-stack-wrap {

}

.goodnotes-stack-wrap.left {
  transform: translateX(-40px) rotate(-2deg);
  opacity:0;
}

.goodnotes-stack-wrap.right {
  transform: translateX(40px) rotate(2deg);
  opacity:0;
}

.goodnotes-stack-card {
  position: absolute;
  inset: 0;
  border-radius: 24px;
  background: linear-gradient(135deg, #1E232F, #151821);
  border: 1px solid #252A36;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.goodnotes-stack-card.s1 {
  transform: translateY(8px) scale(0.97);
  opacity: 0.6;
  z-index: 1;
}

.goodnotes-stack-card.s2 {
  transform: translateY(16px) scale(0.94);
  opacity: 0.3;
  z-index: 0;
}

.goodnotes-card {
  position: relative;
  width: 100%;
  min-height: 420px;
  border-radius: 24px;
  background: linear-gradient(135deg, rgba(27,30,38,0.98), rgba(20,22,27,0.95));

  z-index: 2;
  perspective: 1000px;
  overflow: hidden;
}

.goodnotes-card-inner {
  position: relative;
  width: 100%;
  min-height: 420px;
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.23,1,0.32,1);
}

.goodnotes-card.flipped .goodnotes-card-inner {
  transform: rotateY(180deg);
}

.goodnotes-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  padding: 28px;
  display: flex;
  flex-direction: column;
  border-radius: 24px;
}

.goodnotes-face.back {
  transform: rotateY(180deg);
  overflow: hidden;
}

.goodnotes-face.front {
  justify-content: space-between;
}

.goodnotes-label {
  font-size: 10px;

}

.goodnotes-label.blue {

}

.goodnotes-q {

  line-height: 1.6;
  font-weight: 700;
  color: #E6E8EE;
  margin-top: 16px;
}

.goodnotes-icon-big {
  font-size: 42px;
  opacity: 0.15;
  margin-top: 24px;
}

.goodnotes-hint {
  margin-top: auto;
  font-size: 11px;
  color: #6B7489;
  padding-top: 16px;
  border-top: 1px dashed #252A36;
}

.goodnotes-a {

}

.goodnotes-a::-webkit-scrollbar {

}

.goodnotes-a::-webkit-scrollbar-thumb {

}

.goodnotes-a p {

}

.goodnotes-a p:last-child {

}

.goodnotes-dots {

.goodnotes-dot {

}

.goodnotes-dot.visited {

}

.goodnotes-dot.active {
  background:#0A84FF;
  width:20px;
}

.goodnotes-controls {
  padding: 16px 0 8px;

  flex-direction:column;
  align-items:center;
  gap:12px;
}

.goodnotes-primary {
  width:100%;
  max-width:680px;

.goodnotes-primary:hover {

}

.goodnotes-primary:active {

}

.goodnotes-rate-row {

  max-width:680px;

.goodnotes-rate {

  border:1px solid #252A36;

  flex-direction:column;
  align-items:center;
  gap:4px;

.goodnotes-rate:hover {

.goodnotes-rate b {

/* ===== SPLASH ANIMATED MERCEDES STAR ===== */

.splash{
  position:fixed;
  inset:0;
  z-index:9999;
  background:radial-gradient(1200px 800px at 50% 30%, rgba(10,132,255,0.25), transparent 60%), radial-gradient(800px 600px at 50% 70%, rgba(192,192,192,0.15), transparent 60%), #0B0C0F;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity 0.8s ease, transform 0.8s ease
}

.splash.hide{
  opacity:0;
  transform:scale(1.05);
  pointer-events:none
}

.splash-content{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px
}

.star-wrap{
  position:relative;
  width:140px;
  height:140px;
  display:flex;
  align-items:center;
  justify-content:center
}

.star-wrap img{
  width:100px;
  height:100px;
  -o-object-fit:contain;
     object-fit:contain;
  filter:drop-shadow(0 0 30px rgba(192,192,192,0.4)) drop-shadow(0 0 20px rgba(10,132,255,0.3));
  animation: starRotate 2.2s cubic-bezier(0.23,1,0.32,1), starPulse 2.2s ease-in-out infinite
}

.star-glow{
  position:absolute;
  inset:-20px;
  background:radial-gradient(circle, rgba(10,132,255,0.25), transparent 70%);
  border-radius:50%;
  animation: glowPulse 2.2s ease-in-out infinite;
  pointer-events:none
}

.star-ring{
  position:absolute;
  inset:-10px;
  border:1px solid rgba(192,192,192,0.15);
  border-radius:50%;
  animation: ringExpand 2.2s ease-out infinite
}

.star-ring2{
  position:absolute;
  inset:-25px;
  border:1px solid rgba(10,132,255,0.1);
  border-radius:50%;
  animation: ringExpand 2.2s ease-out infinite 0.3s
}

.splash-content h1{
  font-size:22px;
  font-weight:800;
  letter-spacing:-0.02em;
  color:var(--text);
  animation: textFade 0.8s ease 0.5s both
}

.splash-content p{
  font-size:13px;
  color:var(--text2);
  letter-spacing:0.08em;
  text-transform:uppercase;
  font-weight:600;
  animation: textFade 0.8s ease 0.7s both
}

.loading-bar{
  width:120px;
  height:3px;
  background:var(--surface3);
  border-radius:999px;
  overflow:hidden;
  margin-top:8px
}

.loading-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--accent), #5AC8FF);
  border-radius:999px;
  animation: loading 2s ease-in-out forwards
}

@keyframes starRotate{
  0%{
    transform:rotate(-180deg) scale(0.3);
    opacity:0
  }

  50%{
    transform:rotate(20deg) scale(1.1);
    opacity:1
  }

  100%{
    transform:rotate(0deg) scale(1);
    opacity:1
  }
}

@keyframes starPulse{
  0%,100%{
    filter:drop-shadow(0 0 30px rgba(192,192,192,0.4)) drop-shadow(0 0 20px rgba(10,132,255,0.3))
  }

  50%{
    filter:drop-shadow(0 0 50px rgba(192,192,192,0.6)) drop-shadow(0 0 40px rgba(10,132,255,0.5))
  }
}

@keyframes glowPulse{
  0%,100%{
    transform:scale(1);
    opacity:0.6
  }

  50%{
    transform:scale(1.2);
    opacity:1
  }
}

@keyframes ringExpand{
  0%{
    transform:scale(0.8);
    opacity:0.8
  }

  100%{
    transform:scale(1.4);
    opacity:0
  }
}

@keyframes textFade{
  from{
    opacity:0;
    transform:translateY(10px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

@keyframes loading{
  0%{
    width:0%
  }

  100%{
    width:100%
  }
}

.";else if(e.toLowerCase().includes("spannungsfall")||e.toLowerCase().includes("leitung"))g="Formel mit Herleitung und Zahlenbeispiel: Spannungsfall auf einer Leitung ΔU = 2·I·L·ρ/A. Herleitung: Widerstand der Leitung R = ρ·L/A, doppelte Länge wegen Hin- und Rückleiter, daher 2·L, ΔU = I·R = I·2·L·ρ/A. Kupfer ρ=0,0178 Ω·mm²/m. Beispiel: L=10m, I=2A, A=0,5mm² => ΔU = 2·2·10·0,0178/0,5 = 1,42V. Das ist zu hoch für 24V Anlage, Grenzwert meist 3% =0,72V. Lösung: A=1mm² => ΔU=0,71V i.O. In Prüfung musst du das vorrechnen und die Norm 3% zitieren.";else g="Formel mit Herleitung und Zahlenbeispiel: Ohmsches Gesetz U = R · I. Herleitung aus Definition Widerstand = Spannung pro Strom. Leistung P = U · I. Beispiel: 24V Anlage, Verbraucher 12Ω => I = U/R =24V/12Ω=2A. Leistung P=24V·2A=48W. Absicherung 4A träge wählen, Leitung 0,75mm². Energie W=P·t: Bei 2h Betrieb W=48W·2h=96Wh. In AP1 musst du das schnell im Kopf rechnen und im Messprotokoll eintragen.";else if(a)g="Formel mit Herleitung und Zahlenbeispiel: Kraft am Zylinder F = p·A. Herleitung: Druck p=Kraft pro Fläche, umgestellt F=p·A. Fläche A=π·d²/4. Beispiel: p=6bar =6·10⁵ Pa =6 N/cm²? In Praxis: 6bar =0,6 N/mm². Kolben Ø32mm => A=π·32²/4=804mm². F=0,6·804=482N theoretisch. Abzug Reibung 10% => 434N effektiv. Rückhub mit Kolbenstange Ø12mm => A_ring=804-113=691mm² => F_rück=414N. Das brauchst du für Presskraft oder Heben. Luftverbrauch V=A·Hub·(p_abs/p_atm).";else if(i)g="Formel und Rechenbeispiel aus Steuerung: Zykluszeit SPS = Eingänge lesen + Programm abarbeiten + Ausgänge schreiben + System. Typisch 1-10ms bei S7-1200. Rechenbeispiel: Programm 2000 Anweisungen, je 0,1µs =>0,2ms plus E/A 1ms =>1,2ms Zyklus. Bei TON Zeit: Q wird true nach PT. Beispiel: Motor Nachlauf 5s => TON IN:=Sensor, PT:=T#5s. Wenn Sensor 5s dauerhaft da, dann Q. In Prüfung: Zeitdiagramm zeichnen. Analogwert: NORM_X MIN=0 MAX=27648 VALUE, SCALE_X MIN=0 MAX=10V.";else if(s)g="Formel mit Herleitung: Drehmoment M = F · r. Herleitung aus Hebelgesetz Kraft mal Hebelarm senkrecht. Beispiel: Schraube M10 mit Maulschlüssel 200mm, Handkraft 80N => M=80N·0,2m=16Nm. Anzugsdrehmoment für 8.8 M10 ist 45Nm, also zu wenig, Schraube locker. Leistung mechanisch P = F·v oder P = M·ω. Beispiel Förderband: F=200N, v=0,5m/s => P=100W, Getriebe η=0,9 => Motor 111W => 0,18kW Motor wählen. Passung H7/g6 Spiel 10-29µm.";else if(v)g="Formel und Zahlenbeispiel IT: Subnetzmaske /24 =255.255.255.0 = 24 Bits Netzwerk, 8 Bits Host => 254 nutzbare Adressen. IP Berechnung: Netzwerk 192.168.0.0/24, Host 1-254, Broadcast .255. PROFINET IO Zyklus: Update Zeit 4ms bei 10 Teilnehmern. Beispiel AP1: SPS 192.168.0.1, HMI 192.168.0.2, Maske 255.255.255.0, kein Gateway. Ping Zeit <1ms i.O., >100ms prüfen Kabel. Bandbreite: 100Mbit/s =12,5MB/s, für SPS Daten <1% Last.";else if(h)g="Formel Wirtschaft: Brutto = Netto + Abzüge. Beispiel: Brutto 1000€, Lohnsteuer 80€, SV 200€, Netto 720€. Produktivität = Ausbringung/Einsatz. Kosten: Fixkosten bleiben, variable steigen mit Stückzahl. Break Even: Gewinnschwelle = Fixkosten/(Preis - variable Kosten). Beispiel: Fix 10000€, Preis 50€, variabel 30€ => BE=10000/(20)=500 Stück. In WISO musst du das erklären und 5S, PDCA nennen. Lernkarte mit Wirtschaftlichkeitsrechnung.";else if(C)g="Prüfungsrechenbeispiel Förderband AP1: Anforderung Förderband läuft 10s bei Start, Zylinder stößt Teil ab wenn Lichtschranke, dann zurück. Zeitplan: Sensor S1 Start, Motor Q0.0 an, TON 10s, nach 10s Q0.0 aus, Zylinder Q0.1 vor, S2 Endlage, 2s warten, zurück. Bewertung: Funktion 40P, Aufbau 20P, Messen 10P, Fehlersuche 10P, Fachgespräch 20P. Gesamt 100P. Zeit: 7h Tag1 Aufbau + Programm, Tag2 Prüfung und Gespräch. Beispielrechnung wie oben ΔU und F=p·A kommt immer dran.";else g="Formel mit Herleitung und Zahlenbeispiel: Allgemein F = p·A oder U=R·I je nach Domäne. Beispiel wie im Thema gefordert: 24V 12Ω 2A => I=2A P=48W, 6bar Ø32 482N => F=482N, ΔU=2·I·L·ρ/A 10m 2A 0,5mm² 1,42V zu hoch →1mm² 0,71V i.O. Diese drei Beispiele musst du auswendig können, weil sie in AP1 immer wieder kommen bei Motor, Pneumatik und Leitungsauslegung.";let I=`${e} – ausführliche Definition im Fließtext: ${e} gehört zum Themenfeld ${l} im Bereich ${r}. Die Definition in ganzen Sätzen lautet: ${e} beschreibt einen grundlegenden Zusammenhang, den du in der AP1 als Mechatroniker sicher erklären musst. Im Kern geht es darum, wie Energie, Information oder Kraft in der Anlage von Lars1909-crtl LB Mercedes Edition übertragen, gewandelt oder geschützt wird. Dabei ist wichtig, dass du nicht nur Stichpunkte nennst, sondern in 5 bis 8 Sätzen den Sachverhalt verknüpfst, wie es ein Prüfer erwartet.`,S="Aufbau und Funktion im Detail: Der Aufbau besteht je nach Bauteil aus mehreren Komponenten, die zusammenwirken. Beispielsweise bei elektrischen Komponenten aus Leitern, Isolatoren, Halbleitern oder bei mechanischen aus Grundkörper, Lagerung und Dichtung. Die Funktion entsteht durch physikalische Effekte wie elektromagnetische Kraft, Druckdifferenz oder Reibschluss. Du musst erklären können, wie ein Eingangssignal in ein Ausgangssignal gewandelt wird, welche Zeitkonstanten gelten und wo die Grenzen liegen. Für die Anlage bedeutet das, dass du das Bauteil im Stromlaufplan und im realen Schaltschrank wiedererkennst und seine Klemmen benennen kannst.",U=`${g} Der Prüfer will die Herleitung hören: Woher kommt die Formel, welche Einheiten, welche Annahmen. Du rechnest mit Einheitenkontrolle: Volt = Ohm·Ampere, Watt = Volt·Ampere, Newton = bar·mm². Typischer AP1 Fehler: Einheiten vergessen oder mm² mit m² verwechseln. Deshalb immer sauber umrechnen und Ergebnis mit Toleranz bewerten.`,K=`Anwendung in der Anlage LB Mercedes Edition: In der AP1 Anlage kommt ${e} konkret vor, zum Beispiel am Förderband, am pneumatischen Ausschieber, an der S7-1200 oder am Schaltschrank. Du verdrahtest das Bauteil nach Schaltplan, legst die Leitung mit korrekter Farbe und Querschnitt, prüfst die Funktion mit TIA Portal Beobachten oder Multimeter. Beispiel aus Praxis: Förderband Motor 24V 2A über K1 Schütz, Sensoren an %I0.0 bis %I0.3, Zylinder Ventil an %Q0.0. Wenn ${e} nicht funktioniert, steht die Anlage und du verlierst Punkte.`,y="Normen, Sicherheit und Prüfung: Relevante Normen sind DIN EN 60204-1 für elektrische Ausrüstung von Maschinen, VDE 0100 für Errichten Niederspannung, ISO 13849 für Sicherheitsfunktionen Performance Level, EN 60848 für GRAFCET, ISO 1219 für Pneumatik Symbole. Sicherheit: Vor Arbeiten 5 Sicherheitsregeln beachten, Spannungsfreiheit mit zweipoligem Spannungsprüfer feststellen, Pneumatik entlüften, gegen Wiedereinschalten sichern. In Prüfung musst du Normen nennen können, Schutzleiter messen kleiner 1Ω, Isolationswiderstand größer 1MΩ und das Messprotokoll korrekt ausfüllen.",p=`Typische Fehler und Vermeidung plus Prüfungsantwort: Häufige Fehler sind Verpolung, falscher Querschnitt, Schirm nicht aufgelegt, Sensor PNP statt NPN, Zylinder falsch verschlaucht, SPS Adresse doppelt, TON statt TOF verwendet. Vermeidung durch systematisches Prüfen, halbieren der Strecke, Sichtprüfung, Diagnose LEDs beachten. Prüfungsantwort in Fließtext: Erkläre ${e} mit Definition, Aufbau, Formel mit Zahlenbeispiel 24V 12Ω 2A oder 6bar Ø32 482N oder ΔU Beispiel 1,42V zu hoch →0,71V i.O., Anwendung in Anlage, Normen und Sicherheit, und nenne zwei typische Fehler. So holst du volle Punktzahl.`;return[I,S,U,K,y,p].join(`

`)}function X1(e){return[`Ich kann ${e.thema} in ganzen Sätzen definieren und im Schaltplan der LB Anlage zeigen`,`Ich kann die Hauptformel zu ${e.thema} herleiten und mit Zahlenbeispiel 24V/12Ω/2A oder 6bar/Ø32/482N rechnen`,`Ich kann ${e.thema} in TIA Portal / Pneumatikplan / Mechanik praktisch aufbauen und messen`,`Ich kann Normen DIN EN 60204, VDE 0100, ISO 13849, EN 60848 zu ${e.thema} nennen und Sicherheitsprüfung durchführen`,`Ich kann typische Fehler bei ${e.thema} finden, vermeiden und im Fachgespräch als Fließtext erklären`]}var Y=O1.map((e)=>{let t=(Y1[e.id]||Array.from({length:18},(r,l)=>`Frage ${l+1} zu ${e.thema}`)).map((r,l)=>({q:r,a:L1(r,e,l)}));return{id:e.id,thema:e.thema,kat:e.kat,icon:e.icon,koennen:X1(e),lernset:t}}),cl=[{tag:1,titel:"Tag 1 – Elektrik Grundlagen",ids:["et-grund","messen","schutz"]},{tag:2,titel:"Tag 2 – Leitungen & Bauteile",ids:["leitungen","bauteile","motor"]},{tag:3,titel:"Tag 3 – Steuerungstechnik",ids:["steuerung","sps-hw","sps-prog"]},{tag:4,titel:"Tag 4 – GRAFCET & Pneumatik",ids:["grafcet","pneu-grund","pneu-schalt"]},{tag:5,titel:"Tag 5 – IT & Mechanik",ids:["it","mech-grund","werkstoff"]},{tag:6,titel:"Tag 6 – Lager Zeichnung WISO",ids:["lager","zeichnung","wiso"]},{tag:7,titel:"Tag 7 – Fehlersuche Prüfung",ids:["fehlersuche","pruefung","et-grund"]}],ul="https://Lars1909-crtl.github.io/ap1-f26/",Ie=[{id:"-QB1",bezeichnung:"Hauptschalter 3-polig",ort:"Schaltschrank",kat:"Energie",icon:"\uD83D\uDD0C",kurz:"Zentrale Trennstelle nach DIN EN 60204-1, abschließbar",erklaerung:"Der Hauptschalter -QB1 ist die zentrale Trennstelle der Anlage nach DIN EN 60204-1. Er trennt alle Außenleiter L1, L2, L3 und schaltet den Schaltschrank spannungsfrei für Wartung. Aufbau: 3-poliger Lasttrennschalter mit Drehgriff, abschließbar in 0-Stellung mit Vorhängeschloss, Schaltvermögen 16A bei 400V, mit Hilfskontakt für SPS Rückmeldung. Anschluss: Eingangsseitig kommt die CEE Leitung -X03 mit 3P/N/PE 16A direkt auf die Klemmen 1-3-5, ausgangsseitig geht es zu -QA40 und zum Netzteil -TC1 und zu den Reihenklemmen -XD1 über 2,5mm² schwarz. Der PE wird durchgeschleift, nicht geschaltet, durchgängig bis Montageplatte. Prüfung: Vor Inbetriebnahme Sicht ob Griff leichtgängig, Beschriftung nach Schaltplan, PE Durchgang <1Ω messen, Isolation L-PE >1MΩ bei 500V DC, Funktion: Schalten unter Last testen, Rechtsdrehfeld prüfen, Hilfskontakt in SPS %I0.5 beobachten. Sicherheit: Nur Elektrofachkraft schaltet, 5 Sicherheitsregeln, bei NOT-AUS wird -QB1 nicht ausgelöst, nur -MB9 Hauptventil entlüftet. Typischer Fehler: Lose Klemme an L1 führt zu Unterspannung, SPS geht aus, Diagnose durch Spannungsmessung am Eingang Netzteil. Beispiel F26 0942: Muss als erstes nach CEE geprüft werden, Dokumentation im Messprotokoll."},{id:"-FI1 / -Q1",bezeichnung:"FI Schutzschalter 30mA RCD / Fehlerstromschutzschalter",ort:"Schaltschrank",kat:"Schutz",icon:"\uD83D\uDEE1️",kurz:"FI 30mA RCD Personenschutz nach VDE 0100-410, Testtaste, Summenstromwandler",erklaerung:"FI Schutzschalter ist der Personenschutz nach VDE 0100-410. Er misst Differenzstrom zwischen L und N mit Summenstromwandler. Bei Fehlerstrom >30mA (z.B. Mensch berührt Phase) schaltet er in <0,2s ab. Aufbau: Ringkernwandler, Auslöseelektronik, Schaltschloss, Testtaste T, 2-polig oder 4-polig 40A/30mA Typ A. Anschluss: Eingangsseitig nach -QB1 Hauptschalter L1 L2 L3 N, ausgangsseitig zu -XD1 und Netzteil -TC1 und zu CEE Steckdose 230V. PE wird nicht geschaltet, geht direkt durch über PE Schiene -XD1 16mm². Im Schaltschrank AP1 sitzt er vor der 230V Steckdose für elektrotechnische Arbeiten (16A CEE geschützt durch RCD 30mA laut Prüfungsunterlagen Seite 5 VII/3). Prüfung: Monatlich Testtaste drücken muss auslösen, RCD Testgerät VDE 0413: Auslösezeit bei 30mA <300ms, bei 150mA <40ms, Berührungsspannung <50V, Schleifenimpedanz messen. Typischer Fehler: N und PE vertauscht hinter FI löst sofort aus, oder Neutralleiter über mehrere FIs verteilt führt zu Fehlauslösung. In Prüfung: FI 30mA für Personenschutz an Steckdosen, für Maschine 300mA Brandschutz, Unterscheidung LS vs FI erklären: FI schützt Mensch, LS schützt Leitung."},{id:"-FC1 / -LS",bezeichnung:"Leitungsschutzschalter LS Automat B16",ort:"Schaltschrank",kat:"Schutz",icon:"⚡",kurz:"LS B16 Leitungsschutz Überlast und Kurzschluss nach DIN EN 60898",erklaerung:"Leitungsschutzschalter LS schützt Leitungen vor Überlast und Kurzschluss nach DIN EN 60898. Im Gegensatz zu FI (Fehlerstrom) schützt LS vor zu hohem Strom. Aufbau: Bimetall für Überlast (thermisch, löst bei 1,13-1,45x In nach Minuten) und Magnetschnellauslöser für Kurzschluss (B-Charakteristik 3-5x In). B16 bedeutet B-Charakteristik (für ohmsche Lasten, Beleuchtung) und 16A Nennstrom, Schaltvermögen 6kA. Anschluss: Nach -QB1 und -FI1, L geht durch LS, N über N-Klemme -XD1. In AP1 Schaltschrank schützt er die 24V Netzteil Zuleitung -TC1 L/N und die CEE Steckdose. Verdrahtung 1,5mm² schwarz/blau. Prüfung: Sicht ob Hebel, Beschriftung B16, Auslösecharakteristik B beachten, Messung Schleifenimpedanz Zs damit Kurzschlussstrom >5xIn für B16 also >80A fließt und LS schnell <0,4s auslöst, Isolationsmessung >1MΩ. Unterschied FI vs LS: FI schützt Mensch vor Fehlerstrom 30mA, LS schützt Leitung vor Überstrom 16A. Kombigerät FI/LS = RCBO macht beides in einem Gerät. Typischer Fehler: C statt B eingebaut, C löst erst bei 5-10xIn, bei Einschaltstrom Netzteil -TC1 kann B16 bei hohem Einschaltstrom auslösen, dann C16 besser, aber laut Aufgabe B16."},{id:"-X03",bezeichnung:"CEE Einspeisung 5-pol 16A 3P/N/PE 400V",ort:"Schaltschrank",kat:"Energie",icon:"\uD83D\uDD0C",kurz:"CEE 16A Wanddose rot, Einspeisung mit Phasenwender optional",erklaerung:"Die CEE Einspeisung -X03 ist die Netztrennstelle der Anlage von außen. Es handelt sich um eine 5-polige CEE Wanddose 16A rot mit Deckel, 3 Phasen L1-L3 braun-schwarz-grau, Neutralleiter N blau, Schutzleiter PE grün-gelb, 400V Drehstrom 50Hz. Aufbau: Gehäuse IP44 oder IP67, Schraubklemmen bis 4mm², Zugentlastung PG Verschraubung, Beschriftung -X03 laut Schaltplan Seite 1. Anschluss: Über 5x2,5mm² H07RN-F Gummileitung vom Baustromverteiler, direkt auf -QB1 Hauptschalter, PE auf PE Schiene im Schaltschrank, EMV Schirm nicht nötig. Normen: DIN EN 60309 für CEE, VDE 0100-600 Prüfung vor Inbetriebnahme, DIN EN 60204-1 Farbe rot für 400V. Prüfung: Drehfeld messen mit Duspol oder Drehfeldmessgerät Rechtsfeld, Spannung L-N 230V +-10%, L-L 400V, PE Durchgängigkeit <1Ω, Isolation >1MΩ, Stecker darf nicht heiß werden bei 10A Last. Sicherheit: Vor Anstecken spannungsfrei schalten, Zugentlastung prüfen, Leitung keine Beschädigung. Typischer Fehler: N und PE vertauscht führt zu RCD Auslösung, L2 fehlt dann SPS Netzteil -TC1 ohne Spannung, Fehlersuche durch Spannungsmessung an -QB1 Eingang. In F26 0942 ist -X03 der erste Punkt im Prüfprotokoll."},{id:"-XD13",bezeichnung:"24V DC Verteilerklemme X13 für Sensorik",ort:"Schaltschrank",kat:"Klemmen",icon:"\uD83D\uDD27",kurz:"24V Verteiler für Sensoren und Aktoren, 10-pol Federzug",erklaerung:"Die Klemmenleiste -XD13 ist der zentrale 24V DC Verteiler im Schaltschrank nach dem Netzteil -TC1. Sie verteilt PELV 24V auf Sensorik, Aktorik und SPS Peripherie. Aufbau: 10-polige Reihenklemme Federzug, grau für +24V, blau für 0V, grün-gelb für PE, Brücken mit Kammbrücker, Beschriftung 24V/0V/PE, Querschnitt 0,5-2,5mm². Anschluss: Eingang vom Netzteil -TC1 Klemme +24V mit 1,5mm² rot und 0V blau, Ausgänge zu -XD20 und -XD30 Montageplatte Verteiler, zu SPS Eingängen und zu Magnetventilen -MB11 etc. über Sicherung -FC7. Jede Ader mit Aderendhülse 0,75mm². Normen: DIN EN 60204-1 Farbcode rot für DC Steuerspannung, blau für 0V, VDE 0113, PELV nach EN 60204. Prüfung: Spannung messen 24V DC +-5% = 22,8-25,2V, Brumm <100mV, Kurzschlussfest durch -TC1 elektronisch, PE <1Ω, Durchgang jeder Klemme prüfen. Sicherheit: SELV/PELV Trennung zu 230V >4mm Luft/Kriech, Berührungsschutz. Typischer Fehler: Brücke vergessen dann Sensoren ohne Spannung, oder +24V und 0V vertauscht zerstört PNP Sensor. In F26 0942 ist -XD13 der Knoten für alle 24V Sensoren -BG1 bis -BG32, im Fehlersuchprotokoll muss Spannung an jeder Klemme notiert werden."},{id:"-TC1",bezeichnung:"Netzteil 24V DC PELV 10A",ort:"Schaltschrank",kat:"Energie",icon:"⚡",kurz:"Schaltnetzteil 230V AC zu 24V DC, PELV, Diagnose LED",erklaerung:"Das Netzteil -TC1 wandelt 230V AC aus -QB1 in 24V DC PELV für Steuerung um. Typisch Siemens SITOP oder Phoenix QUINT, 230V Eingang L/N/PE, Ausgang 24V DC 10A, 240W, Wirkungsgrad 93%, Kurzschlussfest, Überlast elektronisch, Pufferzeit 20ms bei Netzausfall. Aufbau: Hutschienenmontage, Eingangsklemmen L N PE, Ausgang +24V -0V, Signalkontakt DC OK für SPS, Potentiometer für 22-28V Einstellung, LED grün OK. Anschluss: Eingang über 1,5mm² schwarz/blau/grüngelb über -QB1 und Sicherung B6A, Ausgang über -FC7 Sicherung zu -XD13 Verteiler mit 1,5mm² rot/blau, PE auf Hutschiene geerdet für EMV. Normen: EN 60204 PELV, EN 61204-3 EMV, EN 61010, SELV Trennung 4kV. Prüfung: Eingang 230V messen, Ausgang 24V DC +-3% messen, Restwelligkeit <50mV mit Oszi, Belastungstest 5A Last P=U·I=120W, Temperatur <50°C, DC OK Kontakt prüfen. Sicherheit: 5 Sicherheitsregeln, Ausgang ist berührsicher aber Kurzschluss vermeiden, Kondensatoren haben Nachlauf 5s nach Ausschalten. Typischer Fehler: Eingangssicherung defekt, Ausgang bricht bei Überlast auf 0V, Diagnose LED blinkt rot. In F26 0942 ist -TC1 die Lebensader, wenn SPS nicht läuft zuerst -TC1 messen, im Messprotokoll Spannung und Strom notieren."},{id:"-K1 SPS",bezeichnung:"SPS CPU S7-1200 1214C DC/DC/DC",ort:"Schaltschrank",kat:"Steuerung",icon:"\uD83D\uDDA5️",kurz:"Siemens S7-1214C, PROFINET, 14DI/10DO, 2AI",erklaerung:"Die SPS CPU -K1 SPS ist das Gehirn der Anlage, Siemens S7-1214C Compact CPU DC/DC/DC. Technische Daten: 14 digitale Eingänge 24V Typ 1, 10 digitale Ausgänge Transistor 0,5A, 2 analoge Eingänge 0-10V, Arbeitsspeicher 100kB, Ladespeicher 4MB, Zykluszeit typisch 1ms für 1000 Anweisungen, PROFINET IO Controller 100Mbit/s, Versorgung 24V DC. Aufbau: Hutschiene, abnehmbare Klemmenblöcke, Status LEDs RUN/STOP/ERROR/MAINT, SD Karten Slot, Ethernet Buchse RJ45. Anschluss: Versorgung 24V von -TC1 über -XD13 mit 1,5mm², Eingänge %I0.0-%I1.5 von Sensoren -BG1..-BG32 über -XD20/-XD30 mit PNP Logik, Ausgänge %Q0.0-%Q1.1 zu Ventilen -MB11..-MB40 und -PF Leuchten und -QA40 Schütz. PROFINET Kabel Cat5e zu HMI optional. Programmierung in TIA Portal V18, Sprache KOP/FUP, OB1 Hauptprogramm, FCs für Förderband und Magazin. Normen: EN 61131-2 für SPS, EN 60204, ISO 13849 PLd für Sicherheitsanteil. Prüfung: In TIA Portal Hardware Konfig IP 192.168.0.1 setzen, Diagnose Puffer lesen, Online beobachten %I und %Q forcieren nur im Einrichtbetrieb, LEDs beachten SF rot = Systemfehler. Sicherheit: Forcen nur mit Freigabe, NOT-AUS -KE2 darf nicht durch SPS überbrückt werden. Typischer Fehler: IP doppelt, Sensor M12 Verpolung zerstört Eingang, Ausgang überlastet >0,5A. In F26 0942: SPS Aufgabe Vereinzeler -MM10 Zeit 3s, Magazin leer -BG3, Ablauf GRAFCET, Bewertung 40 Punkte Funktion."},{id:"-FC7",bezeichnung:"Sicherung 24V für Magnet -MB40",ort:"Schaltschrank",kat:"Sicherheit",icon:"\uD83D\uDEE1️",kurz:"Feinsicherung 4A träge oder elektronischer Schutzschalter",erklaerung:"Die Sicherung -FC7 schützt den Stromkreis für den Permanentmagneten -MB40 24V 45N. Ausführung als Geräteschutzschalter 4A träge oder elektronischer Schutzschalter Siemens SIRIUS 3RM1 2A einstellbar mit Meldekontakt. Grund: -MB40 zieht im Einschaltmoment 1,5A, im Halten 0,4A, Leitungslänge 8m zu Montageplatte, Querschnitt 0,75mm², Spannungsfall berechnen ΔU=2·I·L·ρ/A =2·0,4·8·0,0178/0,75=0,15V akzeptabel. Aufbau: Hutschiene, Eingang von -XD13 24V, Ausgang zu -QA40 Schütz und dann zu -MB40, Beschriftung -FC7, Kennlinie C für induktive Last. Anschluss: 0,75mm² rot/blau mit Aderendhülse, Meldekontakt auf SPS %I0.6 für Diagnose Sicherung ausgelöst. Normen: DIN EN 60204-1 Überstromschutz, VDE 0660, Selektivität zu -TC1 Netzteil 10A. Prüfung: Durchgang messen <0,1Ω, Auslösezeit testen bei 2x In sollte nach 10s auslösen, Isolation >1MΩ, Funktion durch Magnet -MB40 ein- und ausschalten und Strom mit Zange messen 0,4A. Sicherheit: Vor Tausch spannungsfrei, nur gleiche Type 4A träge, bei Kurzschluss zuerst Leitung prüfen. Typischer Fehler: 4A flink statt träge löst beim Einschalten aus, lose Klemme führt zu Erwärmung. In F26 0942: -FC7 ist Prüfungsrelevant, muss im Stromlaufplan erkannt werden und im Messprotokoll Strom und ΔU notiert werden, bei Fehlersuche wenn -MB40 nicht anzieht zuerst -FC7 messen."},{id:"-QA40",bezeichnung:"Schütz für Permanentmagnet -MB40",ort:"Schaltschrank",kat:"Aktorik",icon:"⚙️",kurz:"Leistungsschütz 24V Spule, 4kW, mit Freilaufdiode",erklaerung:"Das Schütz -QA40 schaltet den Permanentmagneten -MB40 für das Anheben der Bauteile. Technisch Siemens Sirius 3RT2015 24V DC Spule, 3 Schließer 9A AC3, 1 Hilfsschließer für Rückmeldung an SPS, Spulenleistung 4W, mit integrierter Freilaufdiode für EMV. Aufbau: Hutschiene, Spulenanschluss A1/A2 mit 24V von SPS Ausgang %Q0.4 über -XD2, Hauptkontakte 1-2 zu -MB40, Beschriftung -QA40. Funktion: Wenn SPS %Q0.4 true, zieht Schütz, -MB40 wird bestromt und erzeugt 45N Haltekraft, Bauteil wird von -MM30 angehoben. Ohne Spannung fällt Magnet ab wegen Permanentmagnet? Nein, -MB40 ist Elektromagnet mit Permanentkern, braucht Strom zum Halten, bei NOT-AUS fällt ab für Sicherheit. Anschluss: A1 +24V über -FC7, A2 0V, Hauptkontakt mit 0,75mm², Hilfskontakt auf %I0.7 Rückmeldung Magnet aktiv. Normen: EN 60947-4-1 für Schütze, EN 60204, ISO 13849 da sicherheitsrelevant beim Heben. Prüfung: Spulenwiderstand messen ca. 144Ω (R=U²/P=24²/4), Anzugspannung 18V, Abfall 6V, Durchgang Haupt 0,05Ω, Funktion mit TIA beobachten und Magnetkraft testen mit Stahlgewicht 2kg. Sicherheit: Freilaufdiode verhindert Spannungsspitze L·di/dt, Schütz darf nicht kleben, bei verschweißtem Kontakt NOT-AUS -KE2 muss -MB40 trotzdem abfallen über zweiten Pfad. Typischer Fehler: Spule verpolt ohne Diode zerstört SPS Ausgang, Hilfskontakt vertauscht führt zu SPS Fehlermeldung Magnet nicht erkannt. In F26 0942: -QA40 ist zentral für Heberfunktion, im Ablauf wenn -MM30 ausgefahren dann -QA40 ein, dann zurück, Bewertung im Fachgespräch erklären warum Schütz und nicht direkt SPS Ausgang: Strom 1,5A zu hoch für SPS Transistor 0,5A."},{id:"-KE2",bezeichnung:"NOT-AUS Sicherheitsrelais / Sicherheitskreis",ort:"Schaltschrank",kat:"Sicherheit",icon:"\uD83D\uDED1",kurz:"Sicherheitsrelais PNOZ oder S7-1200 F-CPU, 2-kanalig, Kategorie 3 PLd",erklaerung:"Das NOT-AUS Sicherheitsrelais -KE2 bildet den Sicherheitskreis für die Anlage nach ISO 13849 Kategorie 3 PLd. Es überwacht den NOT-AUS Taster -SG1 und den Reset -SJ2 und schaltet bei Auslösung das Hauptventil -MB9 / -QM9 ab und den Magnet -MB40 stromlos. Aufbau: 2-kanaliger Eingang für -SG1 Öffner, Querschlussüberwachung, Reset Eingang -SJ2, 2 sichere Ausgänge für Ventil -MB9 und Schütz -QA40, Diagnose LED. Funktion: Im Normalbetrieb beide Kanäle 24V, Relais angezogen, Ausgänge 24V für Pneumatik. Bei NOT-AUS: Kanäle 0V, Relais fällt in <30ms ab, Pneumatik entlüftet über -QM9 3/2 Wege, Zylinder fahren drucklos, Magnet fällt ab. Reset nur nach Entriegeln -SG1 und Taster -SJ2, überwachter Start. Anschluss: Eingang -SG1 mit 2x Öffner mit 0,75mm², Ausgang über -XD2 zu Ventilen, Rückführkreis von Schütz -QA40 Hilfskontakt. Normen: EN ISO 13849-1 PLd, EN 62061 SIL2, EN 60204-1 NOT-AUS Kategorie 1 mit Entlüften, DIN EN 60947-5-5 für NOT-AUS Gerät. Prüfung: Funktionstest NOT-AUS drücken, alle Bewegungen müssen stoppen, Druck fällt auf 0bar in <1s messen mit Manometer, Reset nur nach Entriegeln möglich, Messung Ansprechzeit, PE <1Ω, Isolation >1MΩ. Sicherheit: Niemals NOT-AUS überbrücken, Sicherheitsrelais darf nicht durch Standard SPS ersetzt werden, nur F-CPU oder PNOZ. Typischer Fehler: Nur 1-kanalig verdrahtet, dann kein PLd, Querschluss nicht erkannt, Reset ohne Entriegeln möglich. In F26 0942: -KE2 ist 10 Punkte Sicherheit, im Stromlaufplan erkennen, im Fachgespräch Kategorie erklären, im Prüfprotokoll NOT-AUS Zeit notieren."},{id:"-XD1",bezeichnung:"Reihenklemmenleiste X1 PE und N Verteilung",ort:"Schaltschrank",kat:"Klemmen",icon:"\uD83D\uDD27",kurz:"PE Schiene 16mm² grün-gelb, N Schiene blau, 230V Verteilung",erklaerung:"Die Reihenklemmenleiste -XD1 ist die Hauptverteilung für PE und N und 230V im Schaltschrank. Aufbau: Hutschiene mit PE Klemmen 16mm² grün-gelb direkt auf Hutschiene geerdet, N Klemmen blau 2,5mm² mit Trennscheibe zu PE, L Klemmen grau 2,5mm² für L1 L2 L3, Beschriftung X1:1 bis X1:20. Anschluss: Eingang von -QB1 Hauptschalter L1 L2 L3 N PE mit 2,5mm², PE Schiene mit 16mm² auf Gehäuse, N Schiene isoliert, Ausgänge zu Netzteil -TC1 L/N, zu Steckdose im Schaltschrank, zu -XD2. Normen: VDE 0100-540 PE, DIN EN 60204 Farbe grün-gelb nur PE, blau nur N, 5 Sicherheitsregeln. Prüfung: PE Durchgang von -X03 CEE bis Montageplatte <1Ω messen mit 10A Prüfstrom, N-PE Isolation >1MΩ, Berührungsschutz IP20, festen Sitz prüfen Drehmoment 0,6Nm. Sicherheit: PE niemals schalten, PE zuerst und zuletzt lösen, N und PE nicht verbinden im Schaltschrank außer am Einspeisepunkt. Typischer Fehler: PE Klemme lose dann Schutzleiterwiderstand >1Ω gefährlich, N Klemme mit PE vertauscht RCD löst aus. In F26 0942: -XD1 ist erster Messpunkt für PE und Isolation, muss im Messprotokoll dokumentiert werden, Prüfer schaut auf korrekte Farbe und Beschriftung."},{id:"-XD2",bezeichnung:"Reihenklemmenleiste X2 24V Steuerklemmen",ort:"Schaltschrank",kat:"Klemmen",icon:"\uD83D\uDD27",kurz:"24V Steuerseite, SPS Ein- und Ausgänge, Sensorverteilung",erklaerung:"Die Klemmenleiste -XD2 verteilt die 24V Steuersignale zwischen Schaltschrank und Feld. Aufbau: Doppelstockklemmen 1,5mm² grau, oben +24V, unten Signal, Beschriftung X2:1 = %I0.0 -BG1, X2:2 = %I0.1 -BG2 usw., Brücken für +24V, LED Klemmen optional für Status. Anschluss: Eingänge von Sensoren -BG1..-BG32 über -XD20/-XD30 mit M12 Kabeln, Ausgänge von SPS %Q0.0..%Q0.4 zu -QA40 und Ventilen -MB11.. und zu Leuchtmeldern -PF1.., jeweils 0,5mm². Normen: DIN EN 60204 Farbcode rot für +24V, dunkelblau für 0V, VDE 0113. Prüfung: Durchgang jede Klemme <0,2Ω, Isolation >1MΩ, Beschriftung prüfen, Verdrahtung nach Stromlaufplan Seite 3-5. Sicherheit: Berührungsschutz, Aderendhülsen, keine blanken Drähte. Typischer Fehler: Klemme doppelt belegt, Brücke vergessen, Signal mit +24V vertauscht zerstört Sensor. In F26 0942: -XD2 ist Schnittstelle für Fehlersuche, im Plan muss die Zuordnung %I zu -BG gefunden werden, bei Sensor ohne Funktion zuerst an -XD2 messen: +24V da? Signal ändert 0/24V?"},{id:"-XD3",bezeichnung:"Reihenklemmenleiste X3 Sicherheitskreis",ort:"Schaltschrank",kat:"Klemmen",icon:"\uD83D\uDEE1️",kurz:"Sicherheitsklemmen für NOT-AUS -KE2, 2-kanalig gelb",erklaerung:"Die Klemmenleiste -XD3 ist speziell für den NOT-AUS Sicherheitskreis -KE2 reserviert, gelbe Klemmen zur Unterscheidung. Aufbau: Sicherheitsklemmen 2,5mm² gelb, zweistöckig, Kanal 1 und Kanal 2 getrennt, Beschriftung X3:1 K1 -SG1 Öffner1, X3:2 K2 -SG1 Öffner2, X3:3 Reset -SJ2, X3:4 Rückführkreis -QA40. Anschluss: Von -SG1 Bedientableau mit 2x 0,75mm² geschirmt, Schirm auf PE, zu -KE2 Relais, Ausgänge zu -QM9 Hauptventil und -QA40. Normen: EN ISO 13849 Kategorie 3 verlangt getrennte Kanäle, gelbe Farbe für Sicherheit nach EN 60204, VDE 0113. Prüfung: Beide Kanäle messen 24V im Betrieb, bei NOT-AUS beide 0V, Querschluss Test: Kanal1 auf Kanal2 kurz dann muss -KE2 Fehler melden, Isolation Kanal-Kanal >1MΩ, PE <1Ω. Sicherheit: Niemals Standard Klemme verwenden, Sicherheitskreis nicht mit 0V verbinden, nur Elektrofachkraft. Typischer Fehler: Beide Kanäle auf eine Klemme gelegt, dann kein PLd, Schirm nicht aufgelegt führt zu EMV Fehler. In F26 0942: -XD3 ist Prüfungsfrage Sicherheit, Prüfer fragt nach Farbe gelb und warum zwei Kanäle, im Messprotokoll muss Sicherheitsfunktion mit Zeit <30ms notiert werden."},{id:"-BP1",bezeichnung:"Druckschalter 3,5bar",ort:"Montageplatte",kat:"Pneumatik",icon:"\uD83D\uDCA8",kurz:"Schließer bei Druck >3,5bar, für Freigabe Automatik",erklaerung:"Der Druckschalter -BP1 überwacht den Anlagendruck auf der Montageplatte. Er gibt ein 24V Signal an SPS %I0.4 wenn Druck >3,5bar, Freigabe für Automatik. Aufbau: Pneumatischer Anschluss G1/8, einstellbarer Schaltdruck 1-8bar mit Rändelschraube, Mikroschalter mit Schließer, M12 Anschluss 4-pol, LED gelb bei Druck OK. Funktion: Pneumatik kommt von -QN8 Druckregelventil, -BP1 misst, bei <3,5bar öffnet Kontakt, SPS meldet Störung Druck zu niedrig, Signalsäule -UA3 gelb blinkt, Zylinder fahren nicht. Anschluss: Pneumatik Schlauch 6mm von -QN8, elektrisch M12 Pin1 +24V, Pin3 0V, Pin4 Signal auf -XD20 zu SPS %I0.4, PE über Gehäuse auf Montageplatte geerdet. Normen: ISO 4414 Pneumatik, EN 60204, Druckgerät Richtlinie. Prüfung: Druck einstellen auf 6bar, -BP1 muss bei 3,5bar schalten messen mit Manometer und Multimeter Durchgang, Hysterese ca. 0,3bar, Funktionstest Druck ablassen auf 2bar dann SPS Eingang 0V. Sicherheit: Nicht über 10bar betreiben, Wartungseinheit FRL beachten. Typischer Fehler: Falsche Einstellung 6bar statt 3,5bar dann Anlage startet nicht, Leckage am Pneumatikanschluss führt zu Druckabfall, Sensor defekt bleibt immer 0V. In F26 0942: -BP1 ist Startbedingung für Automatik, im GRAFCET erste Transition Druck OK, im Messprotokoll Schaltdruck notieren, bei Fehlersuche wenn Zyklus nicht startet zuerst -BP1 prüfen."},{id:"-QN8",bezeichnung:"Druckregelventil mit Manometer 0-10bar",ort:"Montageplatte",kat:"Pneumatik",icon:"\uD83D\uDCA8",kurz:"Regelt Anlagendruck von 8bar Netz auf 6bar Arbeit",erklaerung:"Das Druckregelventil -QN8 reduziert den Netzdruck 8-10bar auf den Arbeitsdruck 6bar für die Anlage. Aufbau: Wartungseinheit Kombi mit Manometer 0-10bar Klasse 2,5%, Handrad mit Arretierung, Filter 40µm, Entlüftung bei NOT-AUS über -QM9, Anschluss G1/4 Eingang vom Hausnetz, Ausgang G1/4 zu -BP1 und -QM10..-QM30. Funktion: Durch Drehen wird Federkraft auf Membrane verändert, Ausgangsdruck konstant auch bei Lastwechsel, Überdruck wird abgelassen. Beispiel Rechnung: Eingang 8bar, Ausgang 6bar, Durchfluss 200l/min, Druckabfall bei Zylinderhub <0,2bar akzeptabel. Anschluss: Pneumatik Schlauch 8mm Eingang, 6mm Ausgang, elektrisch kein Anschluss, aber Halterung geerdet. Normen: ISO 4414, EN 983 Sicherheit Pneumatik, UVV. Prüfung: Eingangsdruck messen 8bar, Ausgang auf 6bar einstellen, Manometer vergleichen mit externem geeichten, Dichtheit mit Lecksuchspray, Entlüftungsfunktion bei NOT-AUS testen Druck muss auf 0bar fallen in 1s. Sicherheit: Handrad nach Einstellen arretieren, nicht über 10bar, Filter regelmäßig entleeren. Typischer Fehler: Manometer defekt zeigt 6bar aber real 2bar, -BP1 schaltet nicht, Filter verstopft Durchfluss zu niedrig Zylinder langsam. In F26 0942: -QN8 ist zentral, muss auf 6bar eingestellt werden laut Aufgabe, im Protokoll Eingang/Ausgang notieren, bei Fehlersuche wenn Zylinder keine Kraft haben zuerst -QN8 prüfen F=p·A."},{id:"-UA3",bezeichnung:"Signalsäulenleuchte RGB",ort:"Montageplatte",kat:"HMI",icon:"\uD83D\uDCA1",kurz:"Rot Gelb Grün, 24V, für Betriebszustände",erklaerung:"Die Signalsäule -UA3 zeigt den Betriebszustand der Anlage weithin sichtbar. Aufbau: Säule 3 Segmente rot gelb grün, 24V DC LED 2W je Segment, Buzzer 85dB optional, Fuß mit Montageplatte verschraubt, Anschluss M12 8-pol. Bedeutung: Grün Dauer = Automatik läuft, Grün blinkt = Betriebsbereit, Gelb = Störung z.B. Magazin leer -BG3 oder Druck <3,5bar -BP1, Rot = NOT-AUS -SG1 aktiv oder Sicherheitskreis -KE2 offen. Funktion: Angesteuert von SPS %Q0.5 rot, %Q0.6 gelb, %Q0.7 grün über -XD20, Logik im SPS Programm. Anschluss: +24V von -XD13, 0V, Signale von SPS, PE geerdet. Normen: EN 60204-1 Farben rot Gefahr, gelb Warnung, grün OK, EN 61310. Prüfung: Alle Farben testen über SPS Forcen, Helligkeit >50cd, Buzzer Lautstärke messen, Durchgang LED prüfen, Strom je Farbe ca. 80mA. Sicherheit: Nicht blenden, aber sichtbar aus 5m. Typischer Fehler: LED Segment defekt, Kabelbruch M12, falsche SPS Zuordnung rot und grün vertauscht. In F26 0942: -UA3 ist für Fachgespräch wichtig, du musst Farben erklären, im Ablaufprogramm die Ansteuerung programmieren, z.B. wenn -BG3 kein Teil dann gelb blinkt mit Taktmerker 1Hz."},{id:"-QM9",bezeichnung:"3/2-Wege Hauptventil -MB9 mit NOT-AUS Entlüftung",ort:"Montageplatte",kat:"Pneumatik",icon:"\uD83D\uDD00",kurz:"Hauptabsperrung, bei NOT-AUS entlüftet Anlage",erklaerung:"Das Hauptventil -QM9 / -MB9 ist das Sicherheitsventil für Pneumatik. Es ist ein 3/2 Wege Magnetventil mit Federrückstellung, stromlos geschlossen und entlüftet. Funktion: Im Normalbetrieb bestromt von -KE2 Sicherheitsrelais, Luft von -QN8 geht zu -QM10..-QM30 Ventilinseln. Bei NOT-AUS -SG1 wird -KE2 abgeschaltet, -QM9 stromlos, Arbeitsanschluss wird entlüftet, alle Zylinder werden drucklos, keine Klemmgefahr. Aufbau: Ventil G1/4, Spule 24V DC 4,5W, Handhilfsbetätigung, LED Anzeige, Schalldämpfer am Entlüftungsport. Anschluss: Pneumatik Eingang von -QN8 6bar, Ausgang zu Verteilerschiene, elektrisch Spule A1 +24V von -KE2, A2 0V, Strom 0,18A. Normen: ISO 13849 PLd für Pneumatik Sicherheit, EN 983, DIN EN 60204. Prüfung: Funktionstest NOT-AUS drücken, Druck muss in <1s auf 0bar fallen, Manometer an Verteilerschiene, Durchfluss messen, Spulenwiderstand 133Ω (R=U²/P=24²/4,5), Isolation Spule >1MΩ. Sicherheit: Entlüftungsschalldämpfer nicht verschließen, sonst Druck bleibt. Typischer Fehler: Ventil klemmt durch Schmutz, dann entlüftet nicht, sehr gefährlich, Wartung Filter -QN8. In F26 0942: -QM9 ist Sicherheitsprüfung, im Protokoll Entlüftungszeit notieren, im Stromlaufplan erkennen dass -QM9 von -KE2 kommt nicht von SPS, im Fachgespräch erklären warum 3/2 und nicht 2/2."},{id:"-QM10",bezeichnung:"Ventilinsel 5/2-Wege -MM10 Vereinzeler",ort:"Montageplatte",kat:"Pneumatik",icon:"\uD83D\uDD00",kurz:"Doppel Magnetventil für Zylinder -MM10, bistabil optional",erklaerung:"Die Ventilinsel -QM10 steuert den Vereinzeler Zylinder -MM10. Es ist ein 5/2 Wege Doppel Magnetventil, 2 Spulen -MB11 einfahren und -MB12 ausfahren, bistabil oder mit Federrückstellung je nach Typ. Funktion: Spule -MB11 bestromt => Zylinder fährt ein, -MB12 bestromt => fährt aus, beide stromlos hält Position bei bistabil oder fährt ein bei monostabil. Aufbau: Grundplatte mit 2 Ventilen, Anschluss G1/8 für Zylinder, 6mm Schlauch, Spulen 24V 2,5W je, LED, Handhilfsbetätigung mit Schraubendreher. Durchfluss 300l/min. Anschluss: Pneumatik von -QM9 Hauptventil 6bar, Zylinderanschlüsse 2 und 4 zu -MM10, Abluft über Schalldämpfer, elektrisch -MB11 an SPS %Q1.0, -MB12 an %Q1.1 über -XD20. Normen: ISO 1219 Symbole, ISO 4414, EN 983. Prüfung: Funktionstest beide Richtungen, Geschwindigkeit mit Drosselrückschlag einstellen ca. 0,5m/s, Spulenwiderstand 230Ω, Strom 0,1A, Dichtheit Lecksuchspray, Endlagen -BG11/-BG12 prüfen. Sicherheit: Bei NOT-AUS wird über -QM9 entlüftet, Zylinder bleibt stehen aber drucklos. Typischer Fehler: Spulen vertauscht dann fährt falsch, Handhilfsbetätigung verklemmt, Schlauch vertauscht. In F26 0942: -QM10 ist Hauptaktor für Vereinzeln aus Magazin, im GRAFCET Schritt 2 Vereinzeler ausfahren, im Programm -MB12 3s an, dann Endlage -BG12 abfragen, Bewertung 10 Punkte."},{id:"-QM20",bezeichnung:"Ventilinsel 5/2-Wege -MM20 Stopper",ort:"Montageplatte",kat:"Pneumatik",icon:"\uD83D\uDD00",kurz:"Steuert Stopper Zylinder, hält Bauteile an",erklaerung:"Die Ventilinsel -QM20 steuert den Stopper Zylinder -MM20. Ähnlich -QM10, 5/2 Wege Doppelventil mit Spulen -MB21 einfahren und -MB22 ausfahren. Funktion: Stopper hält Bauteile auf Förderstrecke an für Kontrolle -BG1/-BG2, ausgefahren = gesperrt, eingefahren = frei. Ablauf in F26: Bauteil kommt, -BG1 erkennt Metall, -MM20 fährt aus und stoppt Bauteil für Prüfung. Aufbau: Gleiche Grundplatte wie -QM10, Spulen 24V 2,5W, Durchfluss 300l/min, Drosseln eingebaut für Geschwindigkeitsregulierung. Anschluss: Pneumatik von -QM9, Zylinder -MM20, elektrisch -MB21 %Q1.2, -MB22 %Q1.3. Normen und Prüfung wie -QM10. Sicherheit: Stopper darf bei NOT-AUS nicht unerwartet einfahren und Bauteil freigeben wenn Gefahr, daher Federrückstellung auf gesperrt. Typischer Fehler: Stopper fährt zu langsam, Bauteil rutscht durch, Drossel einstellen. In F26 0942: -QM20 ist für Sortierfunktion, im Programm wenn -BG1 metallisch dann -MM20 ausfahren, Zeit 2s, dann -BG2 kapazitiv prüfen."},{id:"-QM30",bezeichnung:"Ventilinsel 5/2-Wege -MM30 Abweiser/Heber",ort:"Montageplatte",kat:"Pneumatik",icon:"\uD83D\uDD00",kurz:"Steuert Abweiser und Heber mit Magnet -MB40",erklaerung:"Die Ventilinsel -QM30 steuert den Abweiser/Heber Zylinder -MM30, der das Bauteil mit Magnet -MB40 anhebt und abwirft. Aufbau: 5/2 Wege Ventil mit Spulen -MB31 einfahren und -MB32 ausfahren, größere Bauform da Zylinder Ø32mm mehr Luftbedarf, Durchfluss 500l/min, Drosselrückschlagventile extern für sanftes Heben. Funktion: -MM30 eingefahren unten, Bauteil wird von -MM20 gestoppt, -MB40 Magnet an, dann -MM30 ausfahren hebt Bauteil 50mm, dann abwerfen über Rutsche je nach Material. Ablauf: -BG31 eingefahren, -BG32 ausgefahren als Endlagen. Anschluss: Pneumatik 6bar, Zylinder Ø32 Hub 50mm, elektrisch -MB31 %Q1.4, -MB32 %Q1.5. Normen: ISO 1219, EN 983, ISO 13849 da Heben Last. Prüfung: Kraft berechnen F=p·A =6bar·804mm²=482N, abzüglich Reibung 10% =434N, Last Bauteil 0,5kg=5N also genug, Geschwindigkeit 0,3m/s einstellen damit Bauteil nicht abfällt. Sicherheit: Bei Stromausfall muss Magnet -MB40 abfallen und Bauteil nicht hängen bleiben, daher -QA40 Schütz über -KE2. Typischer Fehler: Zylinder zu schnell Bauteil fällt, Magnet zu schwach weil -FC7 ausgelöst. In F26 0942: -QM30 ist Höhepunkt, Heber Funktion wird im Fachgespräch gefragt, 15 Punkte."},{id:"-XD20",bezeichnung:"Aktor/Sensor Verteiler 1 Montageplatte",ort:"Montageplatte",kat:"Klemmen",icon:"\uD83D\uDD27",kurz:"M12 Verteiler 8-fach, 24V, für -BG und -MB",erklaerung:"Der Verteiler -XD20 ist ein passiver Aktor/Sensor Verteiler auf der Montageplatte, 8-fach M12. Er bündelt Sensoren -BG1..-BG21 und Ventile -MB11..-MB21 zu einem Multicore Kabel zum Schaltschrank -XD2. Aufbau: Gehäuse IP67 Kunststoff, 8x M12 Buchse 4-pol, 1x M12 Stecker 8-pol oder M23 für Stammleitung, LED je Port für Signal, Beschriftung -XD20 Port1 = -BG1, Port2 = -BG2 usw. Anschluss: M12 Pin1 +24V braun, Pin3 0V blau, Pin4 Signal schwarz, Stammleitung 8x0,34mm² + Schirm, Schirm auf PE. Normen: IEC 61076-2-101 M12, EN 60204. Prüfung: Durchgang Pin1 zu +24V <0,3Ω, Isolation >1MΩ, LED Funktion testen mit Sensor, Dichtheit IP67, Zugentlastung. Sicherheit: IP67 wichtig wegen Kühlschmierstoff. Typischer Fehler: Port vertauscht -BG1 und -BG2 dann Sortierung falsch, Wasser im Verteiler führt zu Kurzschluss. In F26 0942: -XD20 ist Fehlersuche Punkt, im Plan nachvollziehen welcher Sensor auf welchem Pin, bei Sensor ohne Funktion zuerst an -XD20 messen: +24V da? Signal kommt? Multicore Kabel auf Durchgang prüfen."},{id:"-XD30",bezeichnung:"Aktor/Sensor Verteiler 2 Montageplatte",ort:"Montageplatte",kat:"Klemmen",icon:"\uD83D\uDD27",kurz:"2. Verteiler für -BG22..-BG32 und -MB30..-MB40",erklaerung:"Der Verteiler -XD30 ist der zweite Aktor/Sensor Verteiler auf der Montageplatte, identisch -XD20, aber für die restlichen Sensoren -BG22..-BG32 und Ventile -MB22..-MB40 und -UA3 Signalsäule. Aufbau: 8-fach M12 IP67, LED, Beschriftung Port1 = -BG22 Endlage -MM20 ausgefahren, Port2 = -BG31 usw. Funktion: Bündelung für zweiten Strang zum Schaltschrank, damit Leitungslänge kurz und EMV gut. Anschluss: Wie -XD20, Stammleitung 2 zu -XD2 Schaltschrank. Normen: IEC 61076 M12, EN 60204. Prüfung: Gleich wie -XD20, zusätzlich Strommessung Gesamtverteiler <2A, sonst Sicherung -FC7 prüfen. Sicherheit: Getrennte Verteiler erhöhen Verfügbarkeit, bei Defekt nur ein Strang betroffen. Typischer Fehler: Verteiler 1 und 2 vertauscht im Schaltschrank dann komplette Zuordnung falsch, im TIA Portal %I stimmen nicht. In F26 0942: -XD30 ist für Heber -MM30 und Magnet -MB40, wichtig für Ablauf, im Messprotokoll Spannung an -XD30 messen, bei Fehlersuche Heber ohne Funktion zuerst -XD30 prüfen ob -MB31 Signal ankommt."},{id:"-SG1",bezeichnung:"NOT-AUS Pilztaster 2 Öffner",ort:"Bedientableau",kat:"Sicherheit",icon:"\uD83D\uDED1",kurz:"Roter Pilz Ø40mm, rastend, 2 Öffner, ISO 13850",erklaerung:"Der NOT-AUS Taster -SG1 ist die zentrale Sicherheitseinrichtung am Bedientableau. Ausführung nach ISO 13850: roter Pilzkopf Ø40mm, gelber Hintergrund Ø60mm, rastend mit Drehentriegelung, 2 Öffner Kontakte zwangsöffnend, Schutzart IP65 vorne. Aufbau: Gehäuse Kunststoff, 2 Kontaktelement 1 Öffner je Kanal für -KE2 Sicherheitsrelais, Beschriftung NOT-AUS. Funktion: Bei Gefahr drücken, beide Öffner öffnen, -KE2 erkennt Kanal 1 und 2 =0V, schaltet -QM9 Hauptventil ab und -QA40 Magnet ab, Anlage entlüftet und stoppt. Entriegeln durch Drehen nach rechts, dann Reset -SJ2 drücken. Anschluss: 2x 0,75mm² von -XD3 Sicherheitsklemmen, Kanal1 auf X3:1, Kanal2 auf X3:2, kein Schließer. Normen: ISO 13850 Gestaltung, EN 60947-5-5 Zwangsöffnung, ISO 13849 PLd, EN 60204-1 NOT-AUS muss Pilz sein. Prüfung: Funktionstest beide Öffner messen Durchgang 0Ω geschlossen, >10MΩ geöffnet, Betätigungskraft 20-50N, Entriegelung testen, Zeit bis Entlüftung <1s, PE <1Ω. Sicherheit: Niemals überbrücken, nur zugelassene NOT-AUS verwenden, Sichtprüfung täglich. Typischer Fehler: Nur 1 Öffner angeschlossen dann kein PLd, Taster verklemmt durch Späne, Kontakt verschmort. In F26 0942: -SG1 ist Pflichtprüfung, 10 Punkte Sicherheit, im Fachgespräch musst du erklären warum 2 Öffner und warum gelber Hintergrund, im Messprotokoll Funktion und Zeit notieren."},{id:"-SJ2",bezeichnung:"Reset NOT-AUS Taster blau",ort:"Bedientableau",kat:"Sicherheit",icon:"\uD83D\uDD35",kurz:"Blauer Taster Schließer, für Quittierung nach NOT-AUS",erklaerung:"Der Reset Taster -SJ2 ist der Quittiertaster für den Sicherheitskreis nach NOT-AUS. Ausführung: blauer Drucktaster Ø22mm, Schließer Kontakt, tastend, IP65, Beschriftung Reset oder Quittierung. Funktion: Nach Drücken und Entriegeln von -SG1 muss -SJ2 gedrückt werden, damit -KE2 Sicherheitsrelais wieder anzieht und -QM9 Hauptventil öffnet und Anlage wieder Druck bekommt. Überwachter Start: -SJ2 muss steigende Flanke haben, darf nicht dauerhaft gedrückt sein, sonst Fehler. Anschluss: 0,5mm² blau von -XD3 X3:3 zu -KE2 Reset Eingang, +24V von -XD13, Signal auf SPS %I0.8 zur Anzeige -PF1. Normen: EN ISO 13849 überwachter Start, EN 60204 blau für Reset. Prüfung: Durchgang Schließer 0Ω gedrückt, sonst >10MΩ, Funktion: NOT-AUS drücken, entriegeln, Reset drücken, -KE2 muss klicken und Druck kommen, Zeit messen. Sicherheit: Reset darf keine gefährliche Bewegung auslösen, nur Freigabe. Typischer Fehler: Reset mit NOT-AUS vertauscht, dann keine Quittierung, Taster klemmt, dann -KE2 meldet Fehler Reset dauerhaft. In F26 0942: -SJ2 ist im Ablauf wichtig, im GRAFCET nach NOT-AUS muss Reset kommen, im Protokoll testen, im Fachgespräch erklären Unterschied NOT-AUS und Reset."},{id:"-SJ3",bezeichnung:"Knebelschalter Steuerung EIN/AUS",ort:"Bedientableau",kat:"HMI",icon:"\uD83C\uDF9B️",kurz:"2-stellig, Schließer, schaltet SPS Freigabe",erklaerung:"Der Knebelschalter -SJ3 schaltet die Steuerung Ein/Aus. Ausführung: Knebelschalter 2 Stellungen 0-I, rastend, Ø22mm, 1 Schließer, schwarz, IP65, Beschriftung 0 Aus I Ein. Funktion: Stellung I gibt Freigabe für SPS Programm, -UA3 grün an, -QM9 Hauptventil kann öffnen wenn -KE2 ok und -BP1 Druck >3,5bar. Stellung 0 stoppt Automatik aber nicht NOT-AUS, Pneumatik bleibt unter Druck, nur Zyklus stoppt. Anschluss: +24V von -XD13 auf Kontakt, Ausgang auf SPS %I1.0 und auf -XD2, 0,5mm². Normen: EN 60204 Farben schwarz für Steuerung, EN 60947. Prüfung: Durchgang I =0Ω, 0 =offen, Rastung prüfen, Funktion mit SPS beobachten %I1.0. Sicherheit: Kein Sicherheitsschalter, nur Betrieb. Typischer Fehler: Schalter in 0 dann Anlage startet nicht, Kontakt verschmutzt. In F26 0942: -SJ3 ist erste Bedingung im GRAFCET, muss Ein sein für Start, im Fachgespräch erklären warum nicht NOT-AUS."},{id:"-SJ4",bezeichnung:"Betriebsart Einrichten/Automatik",ort:"Bedientableau",kat:"HMI",icon:"\uD83D\uDD00",kurz:"Knebelschalter 2-stellig, für Hand/Auto Umschaltung",erklaerung:"Der Betriebsart Schalter -SJ4 wählt zwischen Einrichten (Hand) und Automatik. Ausführung: Knebelschalter 2 Stellungen, rastend, Ø22mm, 1 Wechsler oder 2 Schließer, Beschriftung Hand Auto. Funktion: Hand = Einrichtbetrieb, einzelne Zylinder können mit -SJ6..-SJ12 getippt werden für Wartung, Geschwindigkeit reduziert, Sicherheitskreis aktiv, Automatik Start -SJ5 gesperrt. Auto = Automatikbetrieb, Ablauf läuft nach GRAFCET, Hand Taster gesperrt. Anschluss: +24V auf Eingang, 2 Ausgänge auf SPS %I1.1 Hand und %I1.2 Auto über -XD2, 0,5mm². Normen: EN 60204 Betriebsarten, ISO 13849 reduzierte Geschwindigkeit im Einrichten. Prüfung: Durchgang messen, Funktion Hand: Taster -SJ6..-SJ12 müssen gehen, Auto: nur Start -SJ5 geht, Anzeige -PF3 grün für Einricht. Sicherheit: Im Handbetrieb darf keine Quetschgefahr durch schnelle Zylinder, daher Drosseln. Typischer Fehler: Schalter in Hand dann Automatik startet nicht, SPS Programm prüft %I1.2. In F26 0942: -SJ4 ist wichtig für Inbetriebnahme, im Ablauf musst du im Handbetrieb jede Funktion testen, im Fachgespräch erklären warum 2 Betriebsarten."},{id:"-SJ5",bezeichnung:"Start Automatik Taster grün",ort:"Bedientableau",kat:"HMI",icon:"▶️",kurz:"Grüner Leuchtdrucktaster, Schließer, startet Zyklus",erklaerung:"Der Start Taster -SJ5 startet den Automatik Zyklus. Ausführung: Grüner Leuchtdrucktaster Ø22mm, Schließer, tastend, mit LED grün 24V, IP65, Beschriftung Start. Funktion: Im Auto Modus -SJ4 auf Auto, Druck OK -BP1, NOT-AUS nicht aktiv, Steuerung Ein -SJ3, dann -SJ5 drücken startet Zyklus: Magazin -BG3 prüfen, Vereinzeler -MM10 ausfahren, Stopper -MM20 usw. LED leuchtet wenn Zyklus aktiv über SPS %Q0.6. Anschluss: Taster Kontakt +24V auf SPS %I1.3, LED von SPS %Q0.6 über Vorwiderstand, 0,5mm². Normen: EN 60204 grün für Start, EN 60947. Prüfung: Durchgang Schließer 0Ω gedrückt, LED Strom 20mA, Funktionstest Zyklus startet, -PF6 Leuchtmelder Zyklus EIN muss angehen. Sicherheit: Start darf nur bei geschlossenen Schutzeinrichtungen, 2-Hand wenn nötig aber hier nicht. Typischer Fehler: Taster defekt Zyklus startet nicht, LED falsch verdrahtet leuchtet immer. In F26 0942: -SJ5 ist Startbedingung im GRAFCET erste Transition, im Programm Flanke auswerten P Trig, damit nicht Dauerstart."},{id:"-SJ6",bezeichnung:"Taster Zylinder -MM10 einfahren Hand",ort:"Bedientableau",kat:"HMI",icon:"⬅️",kurz:"Schwarzer Taster für Handbetrieb Vereinzeler einfahren",erklaerung:"Der Hand Taster -SJ6 fährt im Einrichtbetrieb den Vereinzeler Zylinder -MM10 ein. Ausführung: Schwarzer Drucktaster Ø22mm, Schließer, tastend, Beschriftung -MM10 Ein. Funktion: Nur wenn -SJ4 auf Hand und -SJ3 Ein und NOT-AUS ok und Druck ok, dann bei Drücken SPS %I1.4 true, SPS setzt Ausgang %Q1.0 -MB11 und Zylinder fährt ein, Endlage -BG11 muss kommen. Anschluss: +24V auf Kontakt, Signal auf SPS %I1.4, 0,5mm² über -XD2. Normen: EN 60204 schwarz für Hand, ISO 13849 Tippen mit reduzierter Geschwindigkeit. Prüfung: Durchgang, Funktion im Handmodus testen, Endlage -BG11 beobachten, Zylinder muss sanft fahren Drossel. Sicherheit: Tippen nur solange gedrückt, bei Loslassen stoppt Zylinder, keine Quetschgefahr. Typischer Fehler: Im Auto Modus geht Taster nicht wegen SPS Sperre, Kontakt defekt. In F26 0942: -SJ6..-SJ12 sind für Inbetriebnahme, musst du im Handbetrieb alle Zylinder testen und im Protokoll notieren, Bewertung 5 Punkte Einrichten."},{id:"-SJ7",bezeichnung:"Taster -MM10 ausfahren Hand",ort:"Bedientableau",kat:"HMI",icon:"➡️",kurz:"Schwarzer Taster für Handbetrieb Vereinzeler ausfahren",erklaerung:"Der Hand Taster -SJ7 fährt im Einrichtbetrieb den Vereinzeler Zylinder -MM10 aus. Ausführung wie -SJ6, schwarzer Taster Ø22mm, Schließer, Beschriftung -MM10 Aus. Funktion: Hand Modus, Drücken => SPS %I1.5 true, Ausgang %Q1.1 -MB12 an, Zylinder fährt aus, schiebt Bauteil aus Magazin, Endlage -BG12. Anschluss: SPS %I1.5. Normen und Prüfung wie -SJ6. Sicherheit: Gleich. Typischer Fehler: Schlauch vertauscht dann fährt falsch, Endlage -BG12 defekt dann SPS denkt nicht ausgefahren. In F26 0942: -SJ7 ist für Vereinzeln, wenn Magazin klemmt kannst du im Handbetrieb mehrmals tippen, im Fachgespräch erklären warum 2 Taster für ein Zylinder und nicht 1 Schalter: Tippen sicherer."},{id:"-SJ8",bezeichnung:"Taster -MM20 einfahren Hand",ort:"Bedientableau",kat:"HMI",icon:"⬅️",kurz:"Hand Taster Stopper einfahren freigeben",erklaerung:"Der Hand Taster -SJ8 fährt den Stopper Zylinder -MM20 ein, gibt Förderstrecke frei. Ausführung: Schwarzer Taster Ø22mm, Schließer, -MM20 Ein. Funktion: Hand Modus, SPS %I1.6, Ausgang %Q1.2 -MB21, Endlage -BG21 eingefahren. Zweck: Im Handbetrieb Bauteile durchlassen ohne Stoppen, für Test. Anschluss: %I1.6. Prüfung: Funktion, Endlage, Geschwindigkeit. Sicherheit: Wenn Stopper einfährt können Bauteile unkontrolliert laufen, daher nur im Hand mit Sicht. Typischer Fehler: Stopper klemmt durch Schmutz, Drossel zu. In F26 0942: -SJ8 für Test Sortierung, wenn -BG1 Materialerkennung testen willst, Stopper einfahren und Bauteil vorbeilaufen lassen."},{id:"-SJ9",bezeichnung:"Taster -MM20 ausfahren Hand",ort:"Bedientableau",kat:"HMI",icon:"➡️",kurz:"Hand Taster Stopper ausfahren sperren",erklaerung:"Der Hand Taster -SJ9 fährt den Stopper Zylinder -MM20 aus, sperrt Strecke. Ausführung: Schwarzer Taster, -MM20 Aus. Funktion: Hand Modus, SPS %I1.7, Ausgang %Q1.3 -MB22, Endlage -BG22 ausgefahren. Bauteil wird angehalten für Kontrolle -BG1/-BG2. Anschluss: %I1.7. Prüfung wie vorher. Sicherheit: Ausgefahren = sicherer Zustand, Bauteile gestoppt. Typischer Fehler: -BG22 defekt dann Bauteil rutscht durch. In F26 0942: -SJ9 wichtig für Materialerkennung, musst im Handbetrieb testen ob -BG1 und -BG2 bei gestopptem Bauteil richtig schalten."},{id:"-SJ10",bezeichnung:"Taster -MM30 einfahren Hand",ort:"Bedientableau",kat:"HMI",icon:"⬇️",kurz:"Hand Taster Heber/Abweiser einfahren unten",erklaerung:"Der Hand Taster -SJ10 fährt den Heber Zylinder -MM30 ein, also nach unten. Ausführung: Schwarzer Taster, -MM30 Ein. Funktion: Hand Modus, SPS %I2.0, Ausgang %Q1.4 -MB31, Endlage -BG31 eingefahren unten. Zweck: Heber in Grundstellung bringen, Magnet -MB40 aus. Anschluss: %I2.0. Prüfung: Kraft F=p·A 482N, muss leicht gehen, Drossel für sanftes Senken. Sicherheit: Beim Einfahren Quetschgefahr unten, daher langsam. Typischer Fehler: Magnet -MB40 noch an beim Einfahren dann Bauteil klemmt. In F26 0942: -SJ10 für Heber Test, im Handbetrieb erst -MB40 aus mit -SJ12 dann -MM30 einfahren."},{id:"-SJ11",bezeichnung:"Taster -MM30 ausfahren Hand",ort:"Bedientableau",kat:"HMI",icon:"⬆️",kurz:"Hand Taster Heber ausfahren oben",erklaerung:"Der Hand Taster -SJ11 fährt den Heber Zylinder -MM30 aus, hebt Bauteil an. Ausführung: Schwarzer Taster, -MM30 Aus. Funktion: Hand Modus, SPS %I2.1, Ausgang %Q1.5 -MB32, Endlage -BG32 oben. Ablauf Hand: -MM20 ausfahren stoppt Bauteil, -MB40 Magnet an, dann -MM30 ausfahren hebt Bauteil 50mm. Anschluss: %I2.1. Prüfung: Endlage oben, Magnetkraft 45N hält Bauteil, Geschwindigkeit einstellen. Sicherheit: Heben mit Last, Magnet muss halten, sonst fällt Bauteil. Typischer Fehler: Druck zu niedrig <3,5bar dann keine Kraft, -BP1 schaltet nicht. In F26 0942: -SJ11 ist für Heber Funktion, Bewertung im Handbetrieb."},{id:"-SJ12",bezeichnung:"Taster Magnet -MB40 deaktivieren Hand",ort:"Bedientableau",kat:"HMI",icon:"\uD83E\uDDF2",kurz:"Blauer Taster zum Ausschalten Magnet im Handbetrieb",erklaerung:"Der Hand Taster -SJ12 schaltet den Magneten -MB40 im Handbetrieb aus, lässt Bauteil fallen. Ausführung: Blauer Taster Ø22mm, Schließer oder Öffner je nach Logik, Beschriftung Magnet Aus. Funktion: Hand Modus, SPS %I2.2, Ausgang -QA40 Schütz aus, Magnet stromlos, Bauteil fällt in Rutsche. Im Automatik wird Magnet über SPS %Q0.4 und -QA40 gesteuert. Anschluss: %I2.2. Normen: Blau für Funktion Aus. Prüfung: Magnet anziehen -MB40 45N, dann -SJ12 drücken muss abfallen, Strom messen 0,4A vorher, 0A nachher, -FC7 Sicherung prüfen. Sicherheit: Magnet darf bei NOT-AUS automatisch abfallen über -KE2. Typischer Fehler: -QA40 klebt dann Magnet bleibt an trotz Taster, gefährlich. In F26 0942: -SJ12 für Test Abwerfen, im Handbetrieb Bauteil anheben mit -SJ11 dann mit -SJ12 abwerfen in richtige Kiste je nach -BG1/-BG2."},{id:"-PF1",bezeichnung:"Leuchtmelder NOT-AUS rot",ort:"Bedientableau",kat:"HMI",icon:"\uD83D\uDD34",kurz:"Rote LED Ø22mm, leuchtet bei NOT-AUS aktiv",erklaerung:"Der Leuchtmelder -PF1 zeigt an dass NOT-AUS aktiv ist. Ausführung: Rote LED Leuchte Ø22mm, 24V DC 20mA, IP65, Beschriftung NOT-AUS. Funktion: Angesteuert von -KE2 Sicherheitsrelais Ausgang oder SPS %Q0.5 invertiert, leuchtet wenn -SG1 gedrückt oder -KE2 offen, auch -UA3 rot leuchtet. Anschluss: +24V über -KE2 oder SPS %Q0.5, 0V, 0,5mm², Vorwiderstand integriert. Normen: EN 60204 rot für Gefahr, EN 60073. Prüfung: Funktionstest NOT-AUS drücken => -PF1 an, Reset => aus, Strom 20mA, Helligkeit. Sicherheit: Muss gut sichtbar sein. Typischer Fehler: LED defekt dann kein Hinweis, falscher Ausgang. In F26 0942: -PF1 ist Anzeige für Sicherheitskreis, muss im Programm angesteuert werden, im Protokoll Funktion notieren."},{id:"-PF3",bezeichnung:"Leuchtmelder Betriebsbereit/Einricht grün",ort:"Bedientableau",kat:"HMI",icon:"\uD83D\uDFE2",kurz:"Grüne LED, Betriebsbereit wenn Steuerung Ein und Druck OK",erklaerung:"Der Leuchtmelder -PF3 zeigt Betriebsbereit oder Einrichtbetrieb. Ausführung: Grüne LED Ø22mm, 24V, Beschriftung Bereit oder Einricht. Funktion: Leuchtet grün Dauer wenn -SJ3 Steuerung Ein, -BP1 Druck >3,5bar, -KE2 OK, -SJ4 auf Einricht, oder blinkt 1Hz wenn Automatik bereit. Angesteuert von SPS %Q0.6 oder %Q0.7 je nach Logik. Anschluss: SPS Ausgang %Q0.6, 0,5mm². Normen: Grün für Bereit. Prüfung: Alle Bedingungen herstellen, LED muss an, bei Druck <3,5bar aus, Strom messen. Sicherheit: Nur Anzeige. Typischer Fehler: -BP1 nicht ok dann bleibt aus, obwohl SPS bereit. In F26 0942: -PF3 ist für Bediener, im GRAFCET erste Anzeige."},{id:"-PF6",bezeichnung:"Leuchtmelder Zyklus EIN gelb",ort:"Bedientableau",kat:"HMI",icon:"\uD83D\uDFE1",kurz:"Gelbe LED, zeigt Automatik Zyklus aktiv",erklaerung:"Der Leuchtmelder -PF6 zeigt dass Automatik Zyklus läuft. Ausführung: Gelbe LED Ø22mm, 24V, Beschriftung Zyklus. Funktion: Angesteuert von SPS %Q0.7 oder Merker Zyklus aktiv, leuchtet wenn -SJ5 Start gedrückt und Ablauf läuft, blinkt wenn Pause. Anschluss: SPS %Q0.7. Normen: Gelb für Automatik aktiv. Prüfung: Start drücken => an, Stop oder Ende => aus. Typischer Fehler: Bleibt an weil Merker nicht zurückgesetzt. In F26 0942: -PF6 ist Anzeige für Bediener, im Programm setzen und rücksetzen."},{id:"-PF7",bezeichnung:"Leuchtmelder Magazin leer gelb blinkend",ort:"Bedientableau",kat:"HMI",icon:"⚠️",kurz:"Gelbe Blink LED für Magazin leer -BG3",erklaerung:"Der Leuchtmelder -PF7 zeigt Magazin leer. Ausführung: Gelbe LED Ø22mm, 24V, blinkend über SPS Taktmerker 1Hz, Beschriftung Magazin leer. Funktion: Wenn LWL Sensor -BG3 kein Bauteil erkennt über Zeit 5s, dann SPS setzt Merker Magazin leer, -PF7 blinkt und -UA3 gelb blinkt, Zyklus stoppt. Anschluss: SPS Ausgang %Q1.6 über Blinklogik. Normen: Gelb blinkend für Warnung. Prüfung: Magazin leeren, -BG3 muss 0V, dann nach 5s -PF7 blinkt, wieder füllen dann aus. Typischer Fehler: -BG3 verschmutzt erkennt immer Teil dann kein Alarm, oder LWL Faser gebrochen. In F26 0942: -PF7 ist wichtige Meldung, im Programm Zeit TON 5s für Magazin leer, im Fachgespräch erklären."},{id:"-BG1",bezeichnung:"Induktiver Sensor Materialerkennung Metall",ort:"Sensorik",kat:"Sensorik",icon:"\uD83D\uDD0D",kurz:"M12 induktiv PNP NO, 4mm Schaltabstand, für Metall",erklaerung:"Der Sensor -BG1 ist ein induktiver Näherungssensor zur Materialerkennung ob Bauteil metallisch ist. Technische Daten: Bauform M12x1, Schaltabstand 4mm bündig, PNP Schließer NO, 24V DC, Strom 200mA, 3-Draht, LED gelb bei Schalten, Schutzart IP67. Funktionsprinzip: Oszillator erzeugt Wechselfeld, Metall bedämpft, Ausgang schaltet auf 24V. Aufbau: Gewindehülse Edelstahl, aktive Fläche, M12 Stecker 4-pol. Anschluss: M12 Pin1 braun +24V, Pin3 blau 0V, Pin4 schwarz Signal auf -XD20 zu SPS %I0.0, bei Metall 24V. Normen: EN 60947-5-2, DIN EN 60204, PNP nach IEC. Prüfung: Metall Teil vorhalten Abstand 2mm muss schalten 24V, kein Metall 0V, Schaltabstand mit Fühlerlehre messen 4mm, LED beobachten, Strom messen 10mA unbedämpft, 200mA bei Last? Durchgang Signal. Sicherheit: Verpolungsschutz, Kurzschlussfest. Typischer Fehler: PNP statt NPN verbaut dann 0V statt 24V, Abstand zu groß dann kein Schalten, Späne auf Sensor führen zu Dauer Signal. In F26 0942: -BG1 ist für Sortierung Metall/Nichtmetall, im Programm wenn -BG1=1 dann Metall, zusammen mit -BG2 kapazitiv für Unterscheidung Alu/Kunststoff, Bewertung 5 Punkte Sensorik."},{id:"-BG2",bezeichnung:"Kapazitiver Sensor Materialerkennung Kunststoff/Stopper",ort:"Sensorik",kat:"Sensorik",icon:"\uD83D\uDD0D",kurz:"M18 kapazitiv PNP NO, 8mm, erkennt Kunststoff und Metall",erklaerung:"Der Sensor -BG2 ist ein kapazitiver Sensor für Materialerkennung am Stopper. Technische Daten: M18 Bauform, Schaltabstand 8mm einstellbar mit Poti, PNP NO, 24V, 3-Draht, erkennt Metall und Kunststoff, aber nicht Luft, IP67. Funktionsprinzip: Kondensator Feld, Dielektrikum ändert Kapazität, auch Kunststoff wird erkannt, Empfindlichkeit mit Poti einstellen. Aufbau: Kunststoffgehäuse, aktive Fläche, M12 Stecker. Anschluss: Pin1 +24V, Pin3 0V, Pin4 Signal auf -XD20 zu SPS %I0.1. Funktion in Anlage: Bauteil am Stopper -MM20, -BG1 induktiv prüft Metall ja/nein, -BG2 kapazitiv prüft ob überhaupt Bauteil da und ob Kunststoff, Kombination ergibt Sortierung: -BG1=1 und -BG2=1 => Metall, -BG1=0 und -BG2=1 => Kunststoff, beide 0 => kein Teil. Normen: EN 60947-5-2, EN 60204. Prüfung: Kunststoff Teil 5mm vorhalten muss schalten, Metall auch, Luft nicht, Poti einstellen bis LED bei Teil an, Hysterese 10%. Typischer Fehler: Zu empfindlich schaltet auf Halterung, zu unempfindlich erkennt Kunststoff nicht, Verschmutzung. In F26 0942: -BG2 ist zweite Materialerkennung, im Programm UND Verknüpfung, im Fachgespräch erklären Unterschied induktiv nur Metall, kapazitiv alle Materialien."},{id:"-BG3",bezeichnung:"LWL Sensor Magazin Überwachung",ort:"Sensorik",kat:"Sensorik",icon:"\uD83D\uDD26",kurz:"Lichtwellenleiter Reflex, erkennt ob Magazin leer",erklaerung:"Der Sensor -BG3 ist ein Lichtwellenleiter Sensor zur Magazin Überwachung ob noch Bauteile vorhanden. Aufbau: LWL Verstärker mit Sender/Empfänger, Lichtleiter Faser Ø2mm, Reflexionsprinzip, PNP NO, 24V, Schaltabstand 0-200mm einstellbar, LED Anzeige. Funktion: Lichtleiter schaut von oben in Magazin Schacht, wenn Bauteil vorhanden reflektiert Licht zurück, Ausgang 24V, wenn leer 0V, SPS meldet nach 5s Magazin leer -PF7. Anschluss: Verstärker 24V + und -, Ausgang Signal auf -XD20 zu SPS %I0.2, LWL Faser mit Halter. Normen: EN 60947-5-2 optisch. Prüfung: Magazin voll => Signal 24V, leer =>0V, Empfindlichkeit mit Poti am Verstärker einstellen, Verschmutzung Faser mit Tuch reinigen, Funktion mit TIA beobachten. Sicherheit: Laser Klasse 1. Typischer Fehler: Faser geknickt oder gebrochen dann immer 0V, Fremdlicht stört, Halter verrutscht. In F26 0942: -BG3 ist Startbedingung, ohne Teil kein Start, im Programm TON 5s für Magazin leer Meldung, im Fachgespräch LWL Prinzip erklären."},{id:"-BG11",bezeichnung:"Endlagensensor -MM10 eingefahren Reed",ort:"Sensorik",kat:"Sensorik",icon:"\uD83D\uDCCD",kurz:"Magnetfeld Sensor für Zylinder -MM10 eingefahren",erklaerung:"Der Endlagensensor -BG11 erkennt ob Zylinder -MM10 eingefahren ist. Ausführung: Magnetfeld Sensor Reed oder Hall, Bauform für C-Nut Zylinder, PNP NO, 24V, 3-Draht, LED gelb, M8 Stecker. Funktionsprinzip: Magnet im Kolben von -MM10 aktiviert Reed Kontakt wenn Kolben in Position eingefahren, Ausgang 24V. Aufbau: Sensor in Nut von Zylinder geschoben und mit Schraube geklemmt, Position justierbar, Kabel 2m. Anschluss: +24V braun, 0V blau, Signal schwarz auf -XD20 zu SPS %I0.3, bei eingefahren 24V. Normen: EN 60947-5-2. Prüfung: Zylinder einfahren, LED muss an, Signal 24V, ausfahren LED aus 0V, Position mit Fühler justieren, Durchgang messen. Typischer Fehler: Sensor verrutscht dann keine Endlage, Kabelbruch, Magnet im Kolben fehlt. In F26 0942: -BG11 ist für Ablauf wichtig, im GRAFCET Transition Zylinder eingefahren, im Programm abfragen, bei Fehlersuche wenn Zylinder fährt aber SPS keine Endlage sieht zuerst Sensor Position prüfen und mit Metall testen."},{id:"-BG12",bezeichnung:"Endlagensensor -MM10 ausgefahren",ort:"Sensorik",kat:"Sensorik",icon:"\uD83D\uDCCD",kurz:"Magnetfeld Sensor für Zylinder -MM10 ausgefahren",erklaerung:"Der Endlagensensor -BG12 erkennt ob Zylinder -MM10 ausgefahren ist. Ausführung wie -BG11, Reed PNP NO, in C-Nut am anderen Ende von -MM10, Signal auf SPS %I0.5? oder %I0.4 je nach Plan, bei ausgefahren 24V. Funktion: Vereinzeler ausgefahren schiebt Bauteil aus Magazin auf Förderstrecke. Anschluss: +24V, 0V, Signal auf -XD20 zu SPS %I0.5, LED. Prüfung: Zylinder ausfahren, LED an, Signal 24V, einfahren aus. Typischer Fehler: 2 Sensoren vertauscht -BG11 und -BG12 dann Logik falsch. In F26 0942: -BG12 ist für Ablauf Schritt 2, muss nach 3s kommen sonst Timeout Störung."},{id:"-BG21",bezeichnung:"Endlagensensor -MM20 eingefahren",ort:"Sensorik",kat:"Sensorik",icon:"\uD83D\uDCCD",kurz:"Stopper Zylinder eingefahren freigabe",erklaerung:"Der Endlagensensor -BG21 erkennt Stopper Zylinder -MM20 eingefahren, also Strecke frei. Ausführung: Magnetfeld Sensor Reed PNP NO, C-Nut, M8, Signal auf SPS %I0.6, LED. Funktion: Wenn -BG21=24V ist Stopper unten, Bauteile können durchlaufen, wenn 0V ist er ausgefahren gesperrt. Anschluss: +24V, 0V, Signal -XD20. Prüfung: Einfahren LED an, ausfahren aus. In F26 0942: -BG21 wird im Programm für Freigabe verwendet, wenn Bauteil sortiert und abgeworfen dann Stopper einfahren um nächstes Bauteil zu holen."},{id:"-BG22",bezeichnung:"Endlagensensor -MM20 ausgefahren",ort:"Sensorik",kat:"Sensorik",icon:"\uD83D\uDCCD",kurz:"Stopper ausgefahren sperrt Bauteil für Kontrolle",erklaerung:"Der Endlagensensor -BG22 erkennt Stopper Zylinder -MM20 ausgefahren, sperrt Bauteil. Ausführung: Reed PNP NO, Signal SPS %I0.7, LED. Funktion: Ausgefahren hält Bauteil an für Materialerkennung -BG1/-BG2. Anschluss: -XD20. Prüfung: Ausfahren LED an. Typischer Fehler: Sensor defekt dann Bauteil rutscht durch. In F26 0942: -BG22 ist Bedingung für Materialerkennung, im GRAFCET wenn -BG22=1 dann -BG1/-BG2 auswerten."},{id:"-BG31",bezeichnung:"Endlagensensor -MM30 eingefahren unten",ort:"Sensorik",kat:"Sensorik",icon:"\uD83D\uDCCD",kurz:"Heber unten Grundstellung",erklaerung:"Der Endlagensensor -BG31 erkennt Heber Zylinder -MM30 eingefahren, unten Grundstellung. Ausführung: Reed PNP NO, Signal SPS %I1.0, LED. Funktion: Grundstellung Heber unten, Magnet -MB40 aus, Bauteil kann von Stopper kommen. Anschluss: -XD30 Verteiler. Prüfung: Unten LED an. In F26 0942: -BG31 ist Ausgangsposition für Heber, im Ablauf muss -BG31=1 bevor Stopper Bauteil freigibt."},{id:"-BG32",bezeichnung:"Endlagensensor -MM30 ausgefahren oben",ort:"Sensorik",kat:"Sensorik",icon:"\uD83D\uDCCD",kurz:"Heber oben angehoben",erklaerung:"Der Endlagensensor -BG32 erkennt Heber Zylinder -MM30 ausgefahren oben, Bauteil angehoben. Ausführung: Reed PNP NO, Signal SPS %I1.1, LED. Funktion: Oben Position, dann Magnet -MB40 aus zum Abwerfen. Anschluss: -XD30. Prüfung: Oben LED an. In F26 0942: -BG32 ist für Abwerfen, wenn oben dann je nach Material in Kiste 1 oder 2 abwerfen durch Magnet aus und evtl. -MM30 leicht bewegen."},{id:"-MM10",bezeichnung:"Pneumatikzylinder Vereinzeler Ø25 Hub 50mm",ort:"Aktorik",kat:"Pneumatik",icon:"\uD83E\uDDBE",kurz:"Doppeltwirkend, schiebt Bauteil aus Magazin",erklaerung:"Der Zylinder -MM10 ist der Vereinzeler, schiebt Bauteile einzeln aus dem Magazin. Technische Daten: Doppelwirkender Pneumatikzylinder Ø25mm, Hub 50mm, Kolbenstange Ø10mm, Magnetkolben für Endlagen -BG11/-BG12, Anschluss G1/8, Betriebsdruck 2-10bar, Kraft bei 6bar F=p·A =0,6N/mm²·491mm²=294N theoretisch, effektiv 265N. Aufbau: Alu Rohr, Enddeckel, Dichtungen NBR, C-Nut für Sensoren, Befestigung Fuß. Funktion: Eingefahren = Magazin zu, ausgefahren = schiebt Bauteil auf Rutsche, Geschwindigkeit mit Drosselrückschlagventilen einstellen 0,4m/s damit Bauteil nicht springt. Anschluss: Pneumatik 2x 6mm Schlauch von -QM10 Ventil, elektrisch nur über Sensoren. Normen: ISO 15552, ISO 4414, EN 983. Prüfung: Kraft berechnen, Hub messen 50mm, Endlagen testen, Dichtheit Lecksuchspray, Geschwindigkeit mit Stoppuhr messen, Reibung prüfen. Sicherheit: Quetschgefahr an Kolbenstange, daher Schutzabdeckung, bei NOT-AUS drucklos. Typischer Fehler: Dichtung verschlissen Leckage, Kolbenstange verbogen, Sensoren verrutscht. In F26 0942: -MM10 ist erste Aktion im Zyklus, im GRAFCET Schritt 2, im Programm -MB12 2s an bis -BG12 kommt, Bewertung 10 Punkte."},{id:"-MM20",bezeichnung:"Pneumatikzylinder Stopper Ø20 Hub 25mm",ort:"Aktorik",kat:"Pneumatik",icon:"\uD83D\uDEA7",kurz:"Stopper, hält Bauteile an für Prüfung",erklaerung:"Der Zylinder -MM20 ist der Stopper, hält Bauteile auf Förderstrecke an. Daten: Ø20mm Hub 25mm doppeltwirkend, Magnetkolben, Kraft bei 6bar F=0,6·314=188N, Hub klein für schnelles Schalten 0,2s. Aufbau: Kompaktzylinder, C-Nut, Befestigung. Funktion: Ausgefahren = Anschlag für Bauteil, eingefahren = Durchlass, wird über -QM20 gesteuert, Endlagen -BG21/-BG22. Anschluss: 6mm Schlauch von -QM20. Normen: ISO 15552. Prüfung: Hub 25mm, Kraft, Geschwindigkeit einstellen schnell damit Bauteil nicht überfährt. Sicherheit: Ausgefahren sicherer Zustand sperrt. Typischer Fehler: Zu langsam Bauteil rutscht durch. In F26 0942: -MM20 für Materialerkennung, wenn -BG22 ausgefahren dann -BG1/-BG2 lesen."},{id:"-MM30",bezeichnung:"Pneumatikzylinder Abweiser/Heber Ø32 Hub 50mm",ort:"Aktorik",kat:"Pneumatik",icon:"\uD83C\uDFD7️",kurz:"Heber mit Magnet -MB40, hebt Bauteile zum Sortieren",erklaerung:"Der Zylinder -MM30 ist der Heber/Abweiser, hebt Bauteile mit Magnet -MB40 an und wirft ab. Daten: Ø32mm Hub 50mm doppeltwirkend, Magnetkolben, Kraft 482N theoretisch, effektiv 434N, hebt 0,5kg Bauteil leicht, Hub 50mm für Abwerfen in 2 Kisten. Aufbau: Führungszylinder mit Verdrehsicherung, Magnet -MB40 an Kolbenstange geschraubt, Endlagen -BG31/-BG32. Funktion: Unten Grundstellung, Bauteil kommt von Stopper, Magnet an, dann ausfahren hebt Bauteil 50mm, dann abwerfen über Rutsche je nach Material. Ablauf: -BG31 eingefahren, -BG32 ausgefahren als Endlagen. Anschluss: 8mm Schlauch von -QM30 wegen großem Volumen, Drosseln für sanftes Heben 0,3m/s. Normen: ISO 15552, ISO 13849 da Heben Last. Prüfung: Kraft F=p·A, Hub, Geschwindigkeit, Magnetkraft 45N muss halten. Sicherheit: Last darf nicht fallen, Magnet muss bei NOT-AUS abfallen, aber dann fällt Bauteil kontrolliert in Auffang. Typischer Fehler: Magnet zu schwach, Bauteil fällt während Heben, Druck zu niedrig. In F26 0942: -MM30 ist Highlight, 15 Punkte, im Programm erst -MB40 an, dann -MM30 ausfahren, dann oben -BG32, dann Magnet aus, dann -MM30 einfahren."},{id:"-MB40",bezeichnung:"Permanentmagnet 24V DC 45N mit Polplatte",ort:"Aktorik",kat:"Aktorik",icon:"\uD83E\uDDF2",kurz:"Elektromagnet 24V, hält Bauteile beim Heben",erklaerung:"Der Magnet -MB40 ist ein Elektromagnet mit Permanentanteil, 24V DC, Haltekraft 45N, zum Halten von Bauteilen beim Heben durch -MM30. Technische Daten: Ø40mm, Höhe 30mm, 24V DC Spule 9W, Strom 0,4A halten, 1,5A Anzug, 100% ED, Polplatte Stahl, Schutzart IP65, Anschluss Litze 0,5mm². Funktionsprinzip: Spule bestromt erzeugt Magnetfeld, Permanentmagnet verstärkt, hält ferromagnetisches Bauteil, bei Stromlos fällt ab. Aufbau: Topfmagnet, Spule, Polplatte,
